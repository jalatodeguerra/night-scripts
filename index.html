    "story": "Leon Trotsky, born Lev Bronstein, had been expelled from the Soviet Union in 1929 and, after Turkey, France and Norway, reached Mexico in January 1937 because President Lázaro Cárdenas granted asylum and Diego Rivera interceded. He and Natalia Sedova first lived in Rivera and Frida Kahlo’s Casa Azul in Coyoacán. In 1937 the Dewey Commission, sitting in that house, found the Moscow-trial charges against him unproved. In May 1939, after a political break with Rivera — not, despite later films, a break caused by Rivera discovering the brief 1937 affair with Kahlo — the Trotskys moved a few blocks to a villa on Avenida Viena and began turning it into a fortress.\n\nBefore dawn on 24 May 1940 a commando of about twenty men in police and army uniforms, led by the muralist David Alfaro Siqueiros, got inside. They raked the bedroom with Thompson submachine guns. Trotsky and Natalia took cover and survived. The American guard Robert Sheldon Harte left with the raiders; his body was found a month later. Siqueiros was later jailed in Mexico; he admitted taking part and claimed the raid was political theatre, not a killing. Soviet archives released after 1991 strengthened the reading that the raid was an NKVD job (Pavel Sudoplatov later called the wider operation “Utka,” Duck) and that Harte had been turned. That archival layer is later than 1940; the Mexican facts of the raid, the bullet-pocked walls, and Harte’s corpse are contemporary.\n\nThe fallback was already inside the house. Ramón Mercader, a Spanish communist recruited during the Civil War, had in 1938 in Paris, using the name Jacques Mornard, begun a relationship with Sylvia Ageloff, a Brooklyn Trotskyist whose sister had worked for Trotsky. In New York he became “Frank Jacson,” a Canadian businessman, and used Ageloff to reach Coyoacán. He posed as a sympathizer and a possible donor. On the afternoon of 20 August 1940, while guards were busy on the roof fitting a siren, he asked Trotsky to read an article draft and was left with him in the study. He carried a raincoat. Inside it, Mexican police later inventoried a pistol, a dagger, and a mountaineering ice axe with the handle shortened for concealment — a pick-and-adze tool, not the kitchen “ice pick” of later headlines. Around 17:20–17:30 he struck Trotsky in the head. The blow did not kill at once. Trotsky fought; Mercader’s hand was broken. Guards beat the attacker until Trotsky, still conscious, ordered them to keep him alive for questioning. Trotsky was operated on and died the next day, 21 August 1940, aged sixty.\n\nMercader told Mexican investigators a cover story: that he was Jacques Mornard and had turned on Trotsky after being asked to commit sabotage in the USSR. That story is the assassin’s legend, not a finding. He was convicted of murder in 1943 by the Sixth Criminal Court of Mexico City and sentenced to twenty years and a day. He served nineteen years and eight months in Lecumberri. Stalin’s government denied responsibility. Mercader’s identity was established in the 1940s–50s (the Catalan journalist Víctor Alba was among the first to name him; Venona material later corroborated the Soviet link). Released in 1960, he went to the Soviet bloc and was decorated. The axe itself passed from the Mexican police museum to a private owner and, in 2017, to the International Spy Museum in Washington. The Coyoacán villa is now a museum; the May bullet scars are still in the walls. Kahlo-movie romance and the phrase “killed with an ice pick” are the main contaminations. The court record is simpler: a named infiltrator, a shortened axe, a struggle, a conviction, a long Mexican sentence.",

    "story": "On 7 July 1985 the Greenpeace ship Rainbow Warrior tied up at Marsden Wharf in Auckland. She had just helped move islanders from irradiated Rongelap and was preparing to lead a flotilla to Moruroa to protest French nuclear tests. The French foreign intelligence service, the DGSE, had already been running a multi-team operation later known — the name is the agency’s, not a journalist’s flourish — as Opération Satanique. Lieutenant Christine Cabon had spent April–May inside the Auckland Greenpeace office as “Frédérique Bonlieu.” The yacht Ouvéa had come down from Nouméa with combat divers, a Zodiac, an outboard and explosives. Commander Alain Mafart and Captain Dominique Prieur were in the city as Swiss newlyweds “Alain and Sophie Turenge,” in a rented Newmans camper van.\n\nAt 23:38 on 10 July a limpet mine opened a car-sized hole in the hull. Most of the crew got off. Portuguese-Dutch photographer Fernando Pereira went back below for cameras. At 23:45 a second mine, near the engine room, detonated. Pereira was knocked out and drowned as the ship flooded. She settled beside the wharf within minutes. New Zealand Navy divers established the next day that both blasts were external. It was a homicide inquiry, not an accident.\n\nThe getaway left a trail. Boaties at the Auckland Outboard Boating Club, already watching for thieves, noted a Zodiac coming ashore and a Newmans van about three hours before the explosions and took the registration. Forestry workers and a couple in Northland had already logged transfers between an Avis station wagon tied to the Ouvéa and the same camper. The saboteurs, working a lower tide than planned, abandoned the Zodiac, the outboard — later traced to a London purchase by an Ouvéa crewman — and French-marked oxygen bottles. On 12 July Mafart and Prieur walked into the Newmans depot in Mount Wellington to return the van early. Staff delayed them; detectives arrested them. Their Swiss passports were false. They admitted being on the waterfront that night and offered an implausible story about helping a fisherman.\n\nA 130-strong inquiry read arrival cards for tens of thousands of visitors, sent officers to Norfolk Island, France and elsewhere, and missed the Ouvéa crew by a day: Australian law gave only a short hold; the yacht was later scuttled and the men reached a French submarine. France first denied everything. The Tricot inquiry of August 1985 claimed the arrested pair had only been spying. Le Monde and others contradicted that. On 20 September Defence Minister Charles Hernu resigned and DGSE chief Admiral Pierre Lacoste was sacked. On 22 September Prime Minister Laurent Fabius stated on television that DGSE agents, acting under orders, had sunk the ship.\n\nOn 4 November 1985, in the High Court at Auckland, Mafart and Prieur changed plea to guilty of manslaughter and wilful damage. Solicitor-General Paul Neazor told the court the Crown could not prove those two had personally planted the mines or intended a death. They were sentenced to ten years for manslaughter and seven for arson, concurrent. Under a 6 July 1986 UN-secretary-general ruling, France paid New Zealand and the pair were transferred to Hao Atoll to serve three years. Both were back in France by May 1988 — Mafart on a medical evacuation, Prieur citing pregnancy — and were later decorated. No other agent stood trial. The wreck was scuttled as a reef at Matauri Bay in December 1987. Later naming of untried living officers as the Zodiac crew is outside the convictions; this file stays with the two who pleaded, Fabius’s admission, and the UN award.",

ial court resentenced them in 2000 to life. In 1997 both applied to the Truth and Reconciliation Commission for amnesty, saying the killing was a political act ordered by the Conservative Party and meant to stall the 1994 election. The Hani family was represented by George Bizos. The Amnesty Committee refused: the two men’s accounts diverged, and the Committee held they had not made full disclosure or proved the killing was a party order. A later court review of that refusal is recorded in the TRC’s final report, volume 6.\n\nThe political context is not decoration. Negotiations to end apartheid were at a peak. Mandela, not yet president, went on television the night of the murder, named the Afrikaner neighbour whose call had produced an arrest, and asked the country not to answer with a race war — the result Waluś and Derby-Lewis later said they had wanted. The 1994 election went ahead. Derby-Lewis died in 2016 after medical parole. Waluś’s parole was ordered by the Constitutional Court in 2022 and carried out that December; later deportation to Poland is a separate administrative fact. Conspiracy stories that fold in a wider state hit, or that treat Gaye Derby-Lewis as a secret third convict, go past the verdicts. The record that matters is the driveway, the neighbour’s plate, the stolen Z88, the two convictions, the refused amnesty, and the life sentences that replaced the rope.",

    "story": "In the small hours of 30 April 1999, Jessica Lal, 34, a model working that night as a celebrity bartender, was shot at a private party in Tamarind Court, the restaurant at Qutub Colonnade in Mehrauli, South Delhi, owned by Bina Ramani. The bar was unlicensed. Liquor service was supposed to stop around midnight. Siddharth Vashisht, known as Manu Sharma, son of Haryana politician Venod Sharma, arrived with friends including Vikas Yadav and Amardeep Singh Gill and demanded a drink after closing, offering money. Lal refused. The later court narrative is that a first shot went into the ceiling and a second struck Lal in the head. She was taken to Apollo Hospital and declared brought dead.\n\nOn 2 May police recovered Sharma’s Tata Safari in Noida. He surrendered in Chandigarh on 6 May. A chargesheet against a dozen people went in on 3 August 1999. Sessions charges for murder were framed against nine on 23 November 2000. The trial then hollowed out. On 3 May 2001 complainant-eyewitness Shyan Munshi turned hostile and did not identify Sharma. Electrician Shiv Das and guest Karan Rajput followed. In all, 32 of 101 prosecution witnesses were declared hostile, among them a ballistic expert. Bina Ramani, her daughter Malini and her husband George Mailhot did identify Sharma. On 21 February 2006 Additional Sessions Judge S. L. Bhayana acquitted all nine in the dock. He held that police had not recovered the weapon and had not proved the two spent cartridges came from one gun.\n\nThe acquittal produced a public campaign — print, television, and SMS calls to boycott businesses linked to the Sharma family — and a police appeal. The Delhi High Court heard the appeal day-to-day from 3 October 2006. On 18 December Justices R. S. Sodhi and P. K. Bhasin convicted Sharma of murder under IPC 302 and of an Arms Act offence, and convicted Yadav and Gill of destroying evidence. On 20 December Sharma received life and a fine; the other two received four years. The High Court also moved toward perjury notices against the hostile witnesses. Sharma appealed. On 19 April 2010 a Supreme Court bench of Justices P. Sathasivam and Swatanter Kumar, in a judgment of more than 250 pages, upheld the High Court. The bench held Sharma’s presence proved by remaining ocular evidence, treated the unrecovered pistol and his failure to report the “stolen” Safari as pointing to guilt, and said the High Court had given cogent reasons to reverse the acquittal. It also said intensive media coverage, which it criticised, had not prejudiced the accused. Yadav’s and Gill’s four-year terms stood.\n\nSharma was released from Tihar in June 2020 after the Delhi Sentence Review Board cited prison conduct and the lieutenant governor signed the order. That administrative remission is not a second acquittal. Tabloid versions that turn the night into a long verbal duel, or that treat every party guest as a bought witness, outrun the judgments. What the courts actually fixed is narrower: an unlicensed bar, a refused drink, a shooting, a first trial wrecked by recantations, and two appellate courts that found the remaining evidence enough for murder.",
