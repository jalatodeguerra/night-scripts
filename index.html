    "hook": "A weeping woman by the water who drowned her children and now hunts the living.",
    "story": "La Llorona is a Mexican and Chicano legend of a weeping woman who walks at night beside rivers, canals, lakes, and irrigation ditches, calling for children she has lost. Parents use her as a warning: stay away from the water after dark; do not follow a crying woman toward the bank. She is not one fixed biography. Folklorists have recorded her across Mexico and into Texas, Arizona, Colorado, and California, and related weeping or river women appear under other names in Central America. What is shared is the sound, the water, and the sense that the living should not answer her.\n\nThe oldest written layer is not the later romance of a jilted mother. Sixteenth-century Franciscan and Dominican chroniclers recorded a woman who wailed in the nights before the Spanish took Tenochtitlan. Bernardino de Sahagún’s Florentine Codex lists, among the omens that troubled the city, a woman who went through the streets crying, “My children, we must go far away,” and sometimes, “My children, where shall I take you?” He and his Nahua informants named her Cihuacoatl, Snake-woman, also called Tonantzin, who appeared in white, walked at night weeping, and was an omen of war. Diego Durán wrote that Moctezuma asked night-walkers to question the woman who went about moaning. Diego Muñoz Camargo’s Historia de Tlaxcala gives the same sixth omen: a woman’s voice, sobbing that her children were already lost. In Sahagún she could leave a cradle in the marketplace; when women looked inside they found a sacrificial flint knife, not a child. That figure is a goddess and a public omen. She is not yet María at the river.\n\nA colonial street legend grew beside the omen. Luis González Obregón, drawing on José María Marroquí, described mid-sixteenth-century Mexico City neighbors who heard sharp, sad cries and saw a woman in white dress and veil walk the center streets to the Plaza Mayor, kneel, face east, give a last lament, and vanish toward the lake. Soldiers who had faced death went pale. The bravest followed at a distance in moonlight and saw her disappear as if she entered the water. They did not know who she was. They called her La Llorona.\n\nThe infanticide story that most people now tell is later. Historian Amy Fuller notes that the folk tale as a printed narrative is hard to find before the late nineteenth and early twentieth centuries, and that its details shift with politics. In the version told most often, a woman — sometimes named María — bears children to a man above her station. He takes a richer, lighter wife. In rage she drowns the children, then wants them back, and dies herself. Heaven turns her away until she finds them. She walks forever in white, hair long and black, crying “¡Ay, mis hijos!” Some tellings say she mistakes living children for her own. Some say she lures men. Some say she only wants company. The people who go to comfort her are the ones who do not come home.\n\nIn many later tellings the cry itself is a trap. If it sounds far away, she is close. If it sounds close, she is far. That inverse-distance rule is also told of other night-walkers in the Americas; it is not in the sixteenth-century omen texts. Appearance varies by region: white dress is common; a veil; long black hair; sometimes a beautiful face that becomes something else when a man looks back. In the Southwest she is often a river or ditch warning. In some Mexican towns she is a street phantom. Related Central American figures such as La Ciguanaba or La Cegua are sometimes equated with her and sometimes kept separate: those women more often punish men than hunt children. Do not collapse her into La Malinche, Cortés’s interpreter. That merger is a modern political reading, strong in mid-twentieth-century plays and in Octavio Paz, not the folk core.\n\nThere is no single charm that binds her. The folk protections are behavioral: keep children from the water after dark; do not follow weeping toward a river; do not answer the cry. Some households treat the     "story": "El Silbón is a specter of the Venezuelan llanos, also told in the eastern Colombian plains. He is a tall, thin man — some say three meters, some six — in worn clothes and a wide llanero hat, a sack of bones over one shoulder. He is heard before he is seen. The whistle climbs the scale, do, re, mi, fa, sol, la, si, and falls again. If the whistle sounds close, he is far. If it sounds thin and distant, he is already in the grass nearby. That inverse-distance rule is the core of the legend. Hearing him at all is sometimes said to foretell a death.\n\nThe story took root in the mid-nineteenth century among cattle people on grasslands the Spanish had stocked since the 1500s. The hat is the rancher’s hat. He is also called El Sin Fin, the Endless. Two origin tales circulate and should not be merged. In the common version, a spoiled young man, drunk, demanded deer offal. When the hunt failed, he murdered his father, cut out the entrails, and had his mother cook them. When she understood what was in the pot, the grandfather took over the punishment: the boy was whipped until his back opened, chili or liquor was rubbed into the wounds, a sack of the father’s bones was hung on him, and dogs were set on him. The curse was that he would walk forever. A second variant has the son kill the father after the father abuses the son’s wife. Same grandfather, same sack, same dogs. Different crime.\n\nHe hunts drunks and womanizers. Some tellings say he sucks the alcohol out of a drunk through the navel. Womanizers he tears apart; their bones go into the sack with his father’s. He sits outside a house and counts the bones one by one. If the people inside hear the counting, and if no drunk or womanizer is among them, the night may pass. If they do not hear it, there will be a wake by morning. A Spanish-language variant adds that a thick whistle means he is after a man and a soft one after a woman. That is a regional coloring, not a universal rule. He is said to appear more in the dry season, sitting in trees and gathering dust, and to wander hungrier on wet nights.\n\nThe only reliable counters in the lore are a barking dog, a whip, and chili — the same tools used in the grandfather’s curse. Nothing else is treated as sure. He is a moral warning on the plains, not a generic South American ghost. The culture is llanero, shared across the Venezuela–Colombia border, especially Portuguesa state and Guanarito in Venezuela and the eastern Colombian llanos.\n\nLater film and festival culture have made him a regional mascot. The 2018 Venezuelan film El Silbón: Orígenes and PBS’s Monstrum episode treat him as heritage horror. Those retellings often flatten the two origin variants into one and dress him as a continent-wide cryptid. The folk story is narrower: a cursed son, a sack of bones, a whistle that lies about distance, and a plains code against drink and adultery.",

    "hook": "A masked woman who asks if she is pretty, then cuts those who answer wrong.",
    "story": "Kuchisake-onna, the slit-mouthed woman, is a Japanese urban legend that broke out in Gifu Prefecture in late 1978 and became a national panic in 1979. Folklorist Iikura Yoshiyuki has called her the first purely Japanese urban legend: not an old yōkai lifted from Edo picture-books, but a rumor that moved through cram schools, local papers, weeklies, and television in a single school year.\n\nThe figure is a tall woman who stops children on night streets. She wears a surgical mask, sometimes a red coat, red beret, or red heels, and carries scissors, a knife, or, in some tellings, a sickle. She asks, “Watashi, kirei?” — Am I pretty? If the answer is no, she attacks. If the answer is yes, she pulls the mask down. The mouth is cut from ear to ear. She asks again: Even like this? No, and the blade comes out. Yes, and she cuts a smile to match hers. That two-question script is the core. Weapons, clothes, and exits change by prefecture and by schoolyard.\n\nChildren invented ways out. Call her “average” or “so-so,” so the yes/no trap fails. Throw bekko-ame hard candy; she stoops to pick it up. Shout “pomade” three times; she is said to hate hair pomade. Say you are late, and in some tellings she bows and lets you pass. She is said to run a hundred meters in six seconds, or to jump three meters, and to lose a chase if you turn a corner she cannot. None of these exits is a ritual. They are rumor variants, and Iikura lists them as evidence that the story grew as children retold it.\n\nThe first printed notice is usually given as the Gifu Nichi Nichi Shimbun of 26 January 1979, in an editor’s-notes column. Behind that print, two local rumors compete. Iikura traces a late-1978 story from Yaotsu, Gifu: an old farm woman saw a slit-mouthed figure in the garden. A Shukan Asahi feature of 29 June 1979, by Hiraizumi Etsuro, puts a prototype in Shinsei-cho, Motosu-gun, Gifu, in early December 1978: an elderly woman going to an outhouse collapsed after seeing her. National weeklies then amplified the tale: Shukan Asahi on 23 March, Shukan Shincho in April, a large June feature, then women’s weeklies in July. By June the rumor had reached Aomori and Kagoshima. Parents and teachers formed patrols. Children walked home in groups. In Himeji a copycat in costume was arrested on weapons charges. Police cars answered calls in Koriyama and Hiratsuka. The chain broke when summer holiday emptied the juku in August 1979.\n\nA jealous samurai husband who slit his wife’s mouth is a later, often Western, add-on. Japanese researchers treat the 1978–79 outbreak as the origin that can be dated. Edo-period “slit-mouth” pictures exist as a look, not as this question-and-answer street script. After 2000 the story traveled online. In South Korea she sometimes wears a red mask and, in a local rule about spirits that can only move in straight lines, cannot turn corners or climb stairs. Japanese films such as Carved (Kuchisake-onna, 2007) gave her a medical-experiment backstory. That is cinema, not the Gifu rumor.",

    "hook": "A woman who died in childbirth and now hunts from the banana trees, announced by a cry that is quiet when she is near.",
    "story": "The pontianak, also called kuntilanak, is a Malay and Indonesian figure of a woman who died pregnant or in childbirth. That is the modern form. Walter William Skeat, writing in Malay Magic in 1900, was careful to split the names. In the Peninsula, he said, the pontianak or mati-anak was usually the ghost of a child who died at birth; the ghost of the woman who died in childbed was the langsuir, and it was the langsuir who got the predatory attributes later tellings give the pontianak. He also said the two were already being confused. Later oral and film tradition fused them. Say that on camera: the names slid.\n\nBy day she may hide in a banana tree, or in tall jungle. By night she walks as a beautiful woman in white, hair down her back. The smell of frangipani, or plumeria, comes first. Then the smell of a corpse. She announces herself with an infant’s cry or a woman’s laugh. If the sound is faint, she is near; if it is loud, she is far. Dogs howl when she is in the district and whine when she is at the fence. She finds men by the scent of laundry left out overnight. Her nails open them. She is said to take organs, and to hunt pregnant women and infants. Some descriptions give her fangs and a hole in the nape of the neck.\n\nA nail driven into that hole — or, in some Indonesian tellings, into the crown of the head — pins her. She becomes a quiet, beautiful wife until someone pulls the nail. Other counters in the wider Malay birth-demon complex include charms, bathing a pregnant woman, and insults aimed at a langsuyar who arrives as an owl. Those are related rites, not one universal pontianak kit.\n\nThe city of Pontianak, on the Kapuas delta in West Kalimantan, keeps her name. Official history is dated: on 23 October 1771 (14 Rajab 1185 H) Syarif Abdurrahman Alkadrie cleared forest at the junction of the Landak and Kapuas rivers and later became the first sultan. The folk founding story says the site was full of crying and laughter from kuntilanak. He fired cannons into the jungle until the spirits fled, then built a mosque and the Kadriyah palace on the cleared ground. Historians note that Dutch accounts of the founding do not record the ghosts or the guns. The legend is local West Kalimantan knowledge; Timo Duile reads it as a story about turning haunted jungle into a Muslim town. Holiday cannon fire is sometimes explained as a nod to that tale.\n\nIndonesian and Malaysian horror cinema — from the 1957 Pontianak films through later Kuntilanak pictures — made her a beautiful vampire in the trees. That look traveled farther than Skeat’s stillborn child. She is a living belief, not a costume, and she is not the same being as the South Asian churel even though both are childbirth revenants.",

    "story": "The tokoloshe — also tikoloshe, uThikoloshe, or Sotho thokolosi, and among Xhosa speakers also hili — is a Nguni figure, short and hairy, often knee-high or hip-high, with a baboon-like face. Older stories put him in rivers and reeds: a water sprite, mischievous and dangerous, able to vanish if he drinks water or swallows a stone. Later and parallel stories say a witch or a vengeful neighbor can send one. Then he is not only a river thing. He is a weapon. Do not collapse those into a single origin. Both are told.\n\nHe comes at night, into the house, to people sleeping on the floor. Illness. Terror. Sometimes death. Households raise the bed: bricks, blocks, or tins under each leg, sleep above his reach. He is a bad climber in those tellings. When bricks are not enough, people ask a sangoma or a pastor with an apostolic calling to drive him out. City papers still run the word in headlines. The Dictionary of South African English treats it as living vocabulary, not a museum label.\n\nMissionaries wrote the name down because it was already known. The earliest English citation is 1833, in Wesleyan missionary Stephen Kay’s Travels and Researches in Caffraria, from the Eastern Cape: Tikaloshi was “much more frequently and familiarly talked about” than among more southern tribes, “some invisible and indescribable being” sometimes personified as “a little ugly, malignant fellow.” William Shaw, in 1860, recorded a belief that bad persons could league with an “imaginary amphibious creature” called utikoloshe. Later ethnography kept the river and the witch-sent familiar side by side. A 1949 handbook called him a small hairy being with a baboon-like face, no higher than a man’s knee. A 1931 account treated Hili as a race of dwarfish male creatures in deep pools and reeds.\n\nA modern speculation says people died in rondavels because winter fires sank carbon monoxide to the floor, and anyone on a raised bed lived, so the tokoloshe was invented to explain the dead. That is not the folk story. It is a later rationalization, and the archive’s own must-keep list flags it as such. Older sexualized tellings — a lascivious sprite who disturbs marriages — sit in missionary and mid-century psychiatric writing. Living practice is broader: misfortune, illness, envy, a neighbor’s curse.\n\nHe is not a cartoon goblin and not “ignorant superstition.” He is current belief among Nguni and Sotho speakers, joked about and feared in the same breath, blamed for everything from bad luck to death. Pop culture and tourist copy often give him glowing red eyes and a single comic pose. The documented figure is smaller and stranger: water and witchcraft, invisibility, a short reach, and a bed on bricks.",

    "hook": "A black Soviet Volga with white curtains that, in communist Poland, was said to take people after dark.",
    "story": "The Black Volga is a Polish urban legend about a GAZ Volga — the Soviet executive sedan, black as a government car — seen on a street after dark. White wheel rims. White curtains in the windows. Sometimes no plates. Sometimes the number is 666. Children were told that the car takes people. Poland in the 1960s and 1970s is the best-documented core. The same rumor later ran in other Eastern Bloc countries, but the Polish name, czarna wołga, is the one folklorists treat as the type.\n\nWho drives it depends on the year the story was heard. Secret police. Organ thieves. Satanists. Nuns or priests in some tellings. The Devil, who rolls down the window and asks the time. If the person answers, they die on the spot, or they die at that same hour tomorrow. The counter-charm in the devil version is to say, “It is God’s time.” Then the car is gone. Other versions said the blood of children was sold to rich foreigners with leukemia, or that kidneys went to Soviet clinics. Those organ-and-blood motives shifted with politics. An antisemitic 1968 variant, born in the state’s anti-Jewish campaign, put a Jewish driver in the seat. Do not use that variant as content.\n\nThe Volga was real. Party men rode in them, as did officials who were not questioned. In April 1965 a Warsaw kidnapping gave the rumor a news hook. Two women, posing as relatives, took three-year-old Lilianna Hencel from a flat on Grochowska Street. Witnesses saw them put the child into a black Volga. The girl was found alive; the abductors were two sisters, one of whom wanted a healthy child. The car in the press reports was enough. After that, almost any missing-child story in Poland could grow a black Volga in a witness statement, whether or not a Volga had been there.\n\nYears later the car in the story changes. At the turn of the twenty-first century it is a black BMW or a Mercedes, still with empty back seats, white curtains, or a 666 plate. In Ostrów Wielkopolski a devil-asks-the-time panic attached to a black BMW. In Czechoslovakia the 1970s form was a black ambulance. In Romania the Volga gave way to restricted Dacia 1301s, then again to ambulances. Soviet tellings sometimes claimed kidnapper plates read SSD, read as a death threat to Soviet children. Those are regional variants. The Polish core remains a black GAZ-21 or GAZ-24 after dark.\n\nJan Harold Brunvand filed the story among European abduction legends. Later pop songs and internet lists treat the car as a Soviet boogeyman. The folk story is narrower: a government-colored sedan, white trim, a child-abduction panic, and, in the devil branch, one sentence that makes the car vanish.",
    "mustKeep": "Black GAZ-21 or GAZ-24; white curtains / white rims. Poland is the best-documented core. Motives shift with politics. Do not use the antisemitic 1968 variant as content. Devil-asks-the-time version: answer “God’s time.”",

    "hook": "A fire-breathing figure in Victorian London who used a policeman’s voice to get a door open, then leapt away.",
    "story": "Spring-heeled Jack is the name given to a figure who terrified London in 1838. The name was already in the street when the Lord Mayor made it official. On 9 January 1838, Sir John Cowan read, at a Mansion House session, an anonymous letter from “a resident of Peckham.” The writer said persons of rank had laid a wager that a companion would visit villages near London in three disguises — ghost, bear, and devil — and frighten people in their gardens. Seven women, the letter claimed, had been driven out of their senses. Cowan called it “extraordinary if true.” The papers printed it. More letters arrived.\n\nThe two attacks that can be tied to contemporary reporting are both in February 1838, both on teenage girls. On the night of 19 February, Jane Alsop answered a violent ringing at her father’s gate in Old Ford. A man in a cloak claimed to be police and said they had caught Spring-heeled Jack in the lane; she was to bring a light. She brought a candle. He threw off the cloak. Eyes like red balls of fire. A helmet. Tight white oilskin. He spat blue-white flame and tore her gown and skin with claws she took to be metal. Her sister pulled her inside. He was gone. The Times and other papers carried her account.\n\nNine days later, on 28 February, Lucy Scales, eighteen, walked Green Dragon Alley in Limehouse with her sister after visiting their butcher brother. A cloaked figure waited in the angle of the passage and put blue flame in her face. She dropped, in fits for hours. He did not touch her. He walked away. Fewer papers ran Scales than Alsop, but the pair of cases fixed the look: cloak, helmet, oilskin, metal claws, blue flame, red eyes.\n\nThe police never took him. Penny dreadfuls did. For the rest of the century he leapt mail coaches, slapped sentries, and laughed from rooftops. An 1877 Aldershot story has a North Camp sentry challenged by a figure who slapped his face with a cold hand and bounded away; shots, in some versions blanks, did nothing. Around 1888 he was said to have stood on the roof of St Francis Xavier’s in Everton. The last famous claim is Liverpool, 1904, William Henry Street: a masked, cloaked figure in long boots bounding onto terraces. Mike Dash, who combed the newspapers for Fortean Studies in 1996, treats many later leaps as rumor built on the 1838 name. He also warns that Peter Haining’s 1977 book invented or inflated incidents, including a Blackheath attack used to pin the Marquess of Waterford. Waterford was a period rumor, named after his death in Brewer’s handbook. He was never convicted of being Jack.\n\nTwentieth-century UFO writing recast Jack as an alien in a jumpsuit. That is not the 1838 legend. The documented core is a London panic, two named assaults, a look that the cheap press froze, and a name that outlived the man, if there was a man.",
    "mustKeep": "Best-documented attacks: Jane Alsop (19 Feb 1838) and Lucy Scales (28 Feb 1838). Traits: cloak, helmet, oilskin, metal claws, blue flame, red eyes, huge leaps. Lord Mayor Sir John Cowan publicized the panic on 9 Jan 1838. Identity unknown; Marquess of Waterford is a period rumor, not a conviction. Do not treat 20th-c. UFO Jack as the 1838 legend.",

    "hook": "A village woman who splits at the waist at night and lowers a thread-like tongue into a pregnant house.",
    "story": "Aswang is not one monster. Filipino folklorist Maximo Ramos sorted the word into five kinds that village speech lumps together: vampire, viscera-sucker, weredog, witch, and ghoul. The image that travels is the viscera-sucker — Tagalog manananggal, “the one who separates.” Say on camera that you are picking that type, not the whole umbrella.\n\nBy day she is a woman in the village, often described as attractive, light-skinned, long-haired. By night she splits at the waist. The upper body grows wings. Herminia Meñez records that she anoints her armpits with a noxious oil and that stiffened hair helps her fly. The hips and legs stay behind, hidden in a closet, under a sheet, or among banana trees, because if they are salted, ashed, vinegared, or turned over she cannot return. If the halves fail to join before sunrise, she dies. The flying half goes to the house of a pregnant woman, a newlywed, or a sick one, and puts down a tongue like a thread or a drinking straw. Through the thatch, through the bamboo floor, into the body. What she wants is the liver, the unborn child, the phlegm of the dying.\n\nSpanish priests wrote versions of this early. Juan de Plasencia, in Customs of the Tagalogs (1589), listed the magtatangal among feared figures: a being who showed himself at night without head or entrails and put the head back by morning. Tomas Ortiz, in the early eighteenth century, described a creature on a neighboring roof, tongue like a thread, drawing out the child. Ramos noted that the viscera-sucker is rare in Europe and common in Malaysia and beyond; related self-segmenting feeders include Indonesian tanggal and Cambodian srei ap. Those are cousins, not the same village story.\n\nCapiz, on Panay, is the province popularly called aswang country. The association is real in jokes and news, not exclusive in the lore. The manananggal is widely recognized in the western Visayas — Capiz, Iloilo, Antique, Bohol — and under other names elsewhere: abat in Waray, aswang na lupad in Bikol, laman luob in Tagalog, kasudlan in West Visayan. Counter-charms include garlic, salt, ash, vinegar, spices, a stingray tail used as a whip, light and noise at a wake, and watching the discarded lower half until dawn.\n\nDo not retell the CIA’s 1950s “Huk aswang” psy-ops as folklore. That was a military rumor campaign. Also do not point at a living town as “monster country.” Accusations still attach to real neighbors. Later film — the 1994 Manananggal and a run of aswang pictures — fixed the bat-winged torso as a national Halloween costume. Ramos’s five-part word is older and wider than that costume. Ramos published the taxonomy in 1969; the village word is older than the academic list.",
    "mustKeep": "Aswang is an umbrella word — pick manananggal and say you are picking. Self-segmentation at the waist; thread-like tongue. Documented 16th c. Capiz association is popular, not exclusive. Do not retell CIA “Huk aswang” psy-ops as folklore.",

    "hook": "An Irish death omen who keens for certain families the night before someone dies.",
    "story": "The banshee — Irish bean sí or bean sídhe, from Old Irish ben síde, “woman of the fairy mound” — is a death omen, not an attacker. Patricia Lysaght, whose 1986 study is the standard, calls her a supernatural death-messenger: a solitary female of the Otherworld, attached to families, heard or seen before a death. She is a woman of the sídhe, the mounds that break the Irish fields. At night she keens. The sound is the sound professional mourners used to make over a corpse, except there is no corpse yet. In some districts the cry is a mournful lament; in others it is a frightening animal noise. The interval between the manifestation and the death may be minutes or two or three days. It is usually relations and neighbors who hear her, not the dying person. She can be heard at the old house even if that person is in another country.\n\nIf she is seen, the look is not fixed. Lysaght found that the common visual type is an old, small woman with long white hair and white clothing. Other tellings give a tall thin woman in white or grey, combing her hair on a riverbank. Sometimes she is a washerwoman at a ford. Sometimes a hag. Do not import the Scottish bean-nighe’s full kit as Irish banshee canon. The washer at the ford appears in Ireland, but the Scottish figure is a separate tradition.\n\nShe is traditionally attached to old Gaelic families, the Ó and Mac names, “the O’s and the Macs.” Later tellings let her cry for Anglo-Norman houses that took Irish names, and even for a few families that came later. Some lineages keep a personal banshee: the O’Brien woman in Clare is called Aoibheall. The National Folklore Collection, on Dúchas.ie, holds schoolchildren’s copies of the same rules: she follows the old names; she is heard the night before; she is not a figure people want to see.\n\nA set of “interference legends” backs a taboo against meddling with her. The comb legend is the best known: someone takes the comb she left on a wall; she comes to the window for it; the comb is handed out on tongs or a shovel, not bare-handed. Other stories leave the imprint of her five fingers on a listener who interrupted her. Once the household admits the cry, death is coming. It cannot be bargained off. There is no charm that sends her away. She is not a demon and not a hunter. Keening is a real mourning practice; she is that practice heard too soon.\n\nNineteenth-century stage Irish and later films — a floating banshee in Darby O’Gill, screaming hags in American horror — turned her into an attacking ghost. Village ethnography did not. Lysaght also noted that the belief thinned in the twentieth century as death moved out of the house and into hospitals. The older story is quieter: a family cry, a mound woman, a death already on the road.",

    "hook": "A bathroom-mirror ritual in which saying a name in the dark is said to bring a woman through the glass.",
    "story": "Bloody Mary is an American schoolyard ritual, not a single biography. In a windowless bathroom, lights off or candles lit, facing a mirror, a name is spoken. Bloody Mary. Mary Worth. Mary Whales. Mary Jane. Mary Johnson. Sometimes “I believe in Mary Worth.” Three times. Ten. Thirteen. Forty-seven. A hundred. Some tellings require a pricked finger and a drop of blood on the glass. Jan Harold Brunvand, in the Encyclopedia of Urban Legends, reduced the rite to a formula: a Mary-name chanted a set number of times into a darkened mirror, often in a bathroom, to summon a witch or ghoul. What happens next is not agreed. She appears as a corpse, a witch, a girl with a cut forehead, a mother holding a dead baby. She scratches the glass, or the face of the person who called her, or she looks until the lights go back on. Some versions say she is harmless if you do not look too long. The story is the ritual itself.\n\nNobody agrees who she was. Queen Mary I of England is a popular guess that folklorists mostly reject. The historical Mary was called Bloody Mary by Protestant enemies for the burnings in her reign, and she suffered false pregnancies; that last detail is sometimes used to explain a dead infant in the glass. Scholars treat it as a name that stuck, not a source. Other guesses are a Salem witch, a murdered girl, a woman burned, a disfigured Mary Worth who cursed a mirror. Simon Bronner collected “Mary Worth rituals” as a girls’ elementary-school tradition with the atmosphere of a séance. One 1984 Pennsylvania text said Bloody Mary was a girl murdered in the woods behind a school, pale, long-haired, blood from a cut in the forehead. Locality writes the backstory. Do not invent a “true crime Mary.”\n\nAlan Dundes, in a 1998 essay later expanded as Bloody Mary in the Mirror (2002), read the rite as puberty fear: blood, a bathroom, a girl’s face arriving in the glass, performed by children at the edge of menstruation. That is a scholarly interpretation, not a folk origin story. What the children pass on is the dare: go in, say the name, look.\n\nRelated mirror-summons exist. Japan’s Hanako-san is a school-toilet ghost who answers if you call; folklorists note the parallel, not an identity. Older European catoptromancy — divination in mirrors — is a distant ancestor of the idea that a face can come out of glass. Twentieth-century film and slasher marketing turned Bloody Mary into a named killer with a fixed biography. The folk thing remains unstable: a bathroom, a count, a woman’s name, and a face that may or may not be there when the lights return.\n\nThis is a children’s dare. It is not instructions. The archive’s job is to say what the rite is, not to send anyone into a locked dark room.",

    "id": "greenbrier-ghost",
    "title": "The Greenbrier Ghost",
    "country": "United States — Greenbrier County, West Virginia",
    "continent": "North America",

    "kind": "true-crime",
    "kindLabel": "True crime",
    "year": "1897",
    "hook": "An 1897 West Virginia murder in which a mother testified that her dead daughter had named the killer, while the autopsy showed a broken neck.",
    "story": "In Greenbrier County, West Virginia, in the winter of 1897, Elva Zona Heaster Shue — she used her middle name — had been married only a short time to Edward Stribbling Shue, a blacksmith known as Trout. They lived in the Richlands. On 23 January she was found dead at home. A local doctor, George W. Knapp, first treated the death as natural. Her body was taken out to Little Sewell and buried.\n\nRumors in the community did not stay quiet. Zona’s mother, Mary Jane Heaster, went to the county prosecuting attorney, John A. Preston, and pressed for another look. Preston spoke with Dr. Knapp and learned that the first examination of the body had not been complete. That was enough to order an inquest. On Monday, 22 February, before Justice Homer McClure and a jury of inquest, the body was exhumed. Three physicians — Drs. Knapp, Rupert, and Houston McClung — conducted a post-mortem. Shue was present, summoned as a witness. The Greenbrier Independent reported that week that the examination showed the neck broken. Later reporting of the medical findings added that the windpipe had been crushed. The inquest jury charged Shue with murder. He was brought to Lewisburg and jailed to await the grand jury. In March he was indicted for felony murder.\n\nThe trial opened in late June 1897 in the Greenbrier County Circuit Court, Judge J. M. McWhorter presiding. Preston and Henry Gilmer appeared for the State; Dr. Rucker and James P. D. Gardner for the defense. The State’s case was the autopsy and Shue’s conduct around the body and at the time of death. The Independent later summarized witnesses who said he had asked the doctor to make no further examination, had helped dress the body, and had put a high collar and a folded veil around the neck. The evidence was circumstantial. Shue had not fled in the four weeks between the death and the arrest. Gilmer argued to the jury that Shue had believed he could not be convicted without an eyewitness.\n\nThe ghost story entered the record because the defense put it there. Counsel for Shue asked Mary Jane Heaster about dreams or visions, hoping to make her look unstable. The Independent printed the questions and answers on 1 July. She said it was no dream: her daughter had come to her four times while she was awake, and on the second night had said her neck had been “squeezed off at the first joint.” The prosecution had not opened with a ghost. Once the defense had asked, the account was on the record.\n\nOn a Thursday afternoon in early July the case went to the jury. After one hour and ten minutes the jury returned first-degree murder and recommended imprisonment rather than death, which under West Virginia law meant life in the penitentiary. A motion for a new trial was entered and then withdrawn. The Independent of 8 July wrote that though the evidence was entirely circumstantial, the verdict met general approval among those who had heard it.\n\nAfter the verdict there were rumors of a lynching. On a Sunday a small group gathered in Meadow Bluff district with a rope. Sheriff Nickell was warned, intercepted them, and talked them into dispersing. Deputy John G. Dwyer had already moved Shue out of the jail into the woods. Shue was taken to the state penitentiary at Moundsville that Tuesday. He died there on 13 March 1900 — about three years later, not eight.\n\nWhat later tourism copy added is not what the court decided. A state historic marker near the Sam Black Church exit of Interstate 64 calls this the “only known case in which testimony from a ghost helped to convict a murderer.” That line is roadside advertising. The prosecution’s evidence was a broken neck and a crushed windpipe. The mother’s visions came in on cross-examination. A later encyclopedia entry also has Shue dying eight years after the sentence; the prison date is 1900. The “no meat for supper” quarrel appears in Mary Jane Heaster’s testimony as something she said her daughter told her. It is not a proven motive, and the Independent’s own comment after the verdict treated motive as inference, not as a finding. A tombstone that now reads “Greenbrier Ghost” is commemoration, not a 1897 court caption.",
    "mustKeep": "Victim Elva Zona Heaster Shue, died 23 Jan 1897. Autopsy 22 Feb: broken neck, crushed windpipe. Defendant Edward Stribbling “Trout” Shue. First-degree murder, life sentence (Greenbrier Independent, 8 July 1897; jury out 1 hour 10 minutes). Died 13 Mar 1900 at Moundsville — about three years later, not “eight.” The ghost story entered on defense cross-examination, not as prosecution evidence.",

    "id": "phantom-of-heilbronn",
    "title": "The Phantom of Heilbronn",
    "country": "Germany",
    "continent": "Europe",
    "countryShort": "Germany",
    "kind": "true-crime",
    "kindLabel": "True crime",
    "year": "1993–2009",
    "hook": "A sixteen-year German manhunt for a woman whose DNA was at forty crime scenes, later traced to contaminated cotton swabs.",
    "story": "From 1993 into 2009, investigators in Germany, and in some Austrian and French files, treated a single female DNA profile as a person. The same profile was reported at about forty crime scenes: burglaries, thefts, and a cluster of killings. The file linked the unknown woman to six murders. The case that gave her a public name was the shooting of police officer Michèle Kiesewetter, 22, on 25 April 2007 in Heilbronn. Kiesewetter and a colleague had stopped in a parking area on the Theresienwiese. She was killed. Her colleague was badly wounded and survived. Their service weapons were taken. A special commission, Soko Parkplatz, was set up. The unknown woman was called the Phantom of Heilbronn, or the Woman Without a Face.\n\nBy January 2009 the reward for information leading to her arrest was 300,000 euros. Investigators released a photofit. It showed a man. That contradiction was one of several that did not fit a single traveling offender. The profile had appeared in Baden-Württemberg, Rhineland-Palatinate, and Saarland, and in Austria. It had not appeared in Bavaria, even though Bavaria sat next to many of the scenes.\n\nThe break was not a capture. It was a result that could not be true. While trying to identify a burned body found in France, thought to be a male asylum seeker who had disappeared in 2002, investigators lifted material from fingerprints on his application papers and got the phantom’s female profile. A second test, using a swab certified free of human DNA, did not find it. Prosecutors in Saarbrücken said that was the point at which the test material itself came under suspicion.\n\nIn late March 2009, Heilbronn prosecutor Volker Link said the puzzle was solved. The cotton swabs used to collect evidence at many of those scenes were sterile — they killed germs — but they were not certified free of human DNA. An unnamed woman who worked at a swab-packing plant in Bavaria had left her own genetic material on unused sticks. Police had been typing the equipment. Klaus Hiller, then president of the Baden-Württemberg state criminal office, said the contaminated swabs would no longer be used. The German Union of Criminal Investigators called for a quality mark that would distinguish DNA-free collection tools from merely sterile medical swabs.\n\nThere was no female serial killer linking those forty scenes. The woman whose DNA started the hunt had committed no crime. The real offences in the pile had to be investigated as themselves. Kiesewetter’s murder was one of them. In November 2011, after the deaths of Uwe Mundlos and Uwe Böhnhardt, investigators attributed that shooting to the National Socialist Underground. The officers’ stolen service weapons were found among the group’s belongings. Blood matching Kiesewetter was later reported on clothing recovered from the Zwickau hideout. The phantom hunt had been a false trail laid over a real killing.\n\nLater retellings still collapse the case into a ghost story: a faceless woman who murdered across borders for sixteen years, or a factory worker who “sneezed on the swabs.” Neither is what the prosecutors said. The photofit of a man produced a brief public speculation that the offender might be transsexual. That was a press extra, not a finding. The contamination was accidental transfer during manufacture or packing, not a named sneeze. Do not name the factory worker. The serial-killer woman never existed. The crimes did.",
    "mustKeep": "Same female DNA at ~40 scenes, 1993–2009. Linked in the file to six murders, including Michèle Kiesewetter, 25 Apr 2007. Reward €300,000 (Jan 2009). March 2009: prosecutor Volker Link — contamination; no phantom offender. Swabs sterile but not DNA-free. Do not name the factory worker. Do not say she “sneezed on the swabs.”",

    "hook": "Three English wives found drowned in rented baths, three inquests that called it accident, and one bigamist hanged in 1915.",
    "story": "In England in the 1910s, three women died in rented bathtubs in three towns. Three different inquests called the deaths accidental.\n\nGeorge Joseph Smith was born in Bethnal Green, London, on 11 January 1872. He had a record for fraud and theft. His only legal marriage was to Caroline Thornhill in 1898. Between 1908 and 1914 he went through a string of bigamous marriages under other names, often leaving after taking money. The three deaths that became the case were not his only marriages. They were the three that ended in a bath.\n\nIn 1910, using the name Henry Williams, he married Beatrice Constance Annie “Bessie” Mundy. He left her, then they met again in 1912 and went to Herne Bay, Kent. He rented 80 High Street and obtained a bathtub. He took her to a local doctor, Frank French, for supposed fits. She made a will in his favor days before she died. On 13 July 1912 she was found drowned in the bath. The inquest said misadventure. Williams collected under the will.\n\nIn November 1913, using his own name, he married Alice Burnham, a nurse, at Portsmouth. A life-insurance policy and a will were put in order. They took lodgings at 16 Regent Road, Blackpool, after he had asked about a bathtub. On 12 December 1913 she died in the bath. Another inquest: accidental drowning.\n\nOn 17 December 1914, using the name John Lloyd, he married Margaret Elizabeth Lofty at a registry office in Bath. They came to London the same day and took rooms at 14 Bismarck Road, Highgate. She had taken out life insurance with Lloyd as beneficiary. A will in his favor was made on 18 December. That night she was found dead in the bath. Another inquest: accident.\n\nAlice’s father, Charles Burnham, and the Blackpool landlady’s household saw a News of the World account of the Highgate death and recognized the pattern. In January 1915 Joseph Crossley, the Blackpool boarding-house owner, wrote to the Metropolitan Police enclosing cuttings of both inquests. Divisional Detective Inspector Arthur Neil took the file. He visited the Highgate house, noted the size of the tub, and learned of the will and the insurance. Smith, still using the Lloyd name, was watched at a lawyer’s office. On 1 February Neil questioned him; he first denied being Smith, then admitted the name, and was held on suspicion of bigamy. He was formally charged with the three murders on 23 March 1915.\n\nThe bodies were exhumed. Home Office pathologist Bernard Spilsbury examined them. He told the court that the Herne Bay tub, given Mundy’s height, was a poor fit for an ordinary epileptic drowning. The trial opened at the Old Bailey on 22 June 1915. Under English law Smith could be tried only for Mundy’s murder. Mr Justice Scrutton allowed the other two deaths as evidence of a “system,” over the protest of defense counsel Sir Edward Marshall Hall. Smith did not give evidence. The jury was out about twenty minutes. Guilty, 1 July 1915. The appeal, arguing that the system evidence had been wrongly admitted, was dismissed by Lord Reading. Smith was hanged at Maidstone Prison on 13 August 1915 by John Ellis.\n\nHe was not separately convicted of all three murder counts in that trial. Later popular versions add whispers at the tub, a reconstructed “pull the feet” demonstration as if it were courtroom proof of the exact method, and a sexualized picture of the three women. The court had three inquests that never compared notes, three financial arrangements close to three deaths, and a pattern the judge let the jury hear. That was the case.",
    "mustKeep": "Killer George Joseph Smith (aliases Henry Williams, John Lloyd). Bessie Mundy, Herne Bay, July 1912. Alice Burnham, Blackpool, 12 Dec 1913. Margaret Lofty, Highgate, 18 Dec 1914. Tried for Mundy’s murder; other deaths admitted as “system.” Guilty 1 July 1915; hanged 13 Aug 1915, Maidstone. He was not separately convicted of all three murder counts in that trial.",

    "hook": "A tiger shark in a Sydney aquarium vomited a tattooed human arm that had been cut off with a knife, opening a 1935 murder case that never produced a conviction.",
    "story": "On 17 April 1935 a fisherman off Coogee Beach, Sydney, hooked a small shark. A larger tiger shark swallowed it and was itself landed. The tiger shark, still alive, was taken to the Coogee Aquarium Baths as a holiday attraction for the Anzac Day weekend. Late February and early March had seen fatal shark attacks on New South Wales beaches. Crowds came to look at this one.\n\nFor several days the shark fed. On 25 April, Anzac Day, it became ill in front of spectators, then convulsed and vomited a human left arm into the pool. The arm had a tattoo of two boxers. A medical examination said it had not been bitten off. It had been cut with a knife or other sharp instrument, and not as a surgical amputation. Fingerprints could still be taken.\n\nAfter a newspaper description of the tattoo, Edwin Smith told police the arm could be his brother James “Jim” Smith, a former boxer and suburban billiard-saloon keeper, missing since 7 April. Fingerprints confirmed it. Smith had been a bankrupt builder and had a record of minor convictions. The rest of his body was never found. Three days after the arm appeared, the aquarium killed and gutted the shark, which limited what else could be recovered from it.\n\nPolice last placed Smith drinking with Patrick Brady at the Cecil Hotel in Cronulla, then at a cottage Brady had rented on Gunnamatta Bay. A Cronulla cab driver said that the next morning Brady had taken a taxi to North Sydney and been dropped at the house of Reginald William Lloyd Holmes, a boat-builder at McMahons Point on Lavender Bay. Holmes ran a successful family business. Police also treated him as a man involved in insurance fraud and in smuggling runs off Sydney Heads, work in which Smith had sometimes been employed. Those associations were the investigation’s working theory. They were not findings of a court.\n\nOn 20 May Holmes left his boatshed in a speedboat, tried to shoot himself on the harbour, fell in, was held by a rope, climbed back aboard, and led water police on a chase down Sydney Harbour for hours before he was taken. He then agreed to be a witness against Brady. Brady was charged with Smith’s murder.\n\nOn the morning of 12 June — the day the inquest into Smith was to begin — Holmes was found shot dead in his car at Dawes Point. With Holmes dead, the Crown case against Brady collapsed. The trial lasted less than two days. The judge directed an acquittal. Brady walked free. He died in 1965, still denying the charge. No one was convicted of killing Smith or Holmes.\n\nSydney’s coroner, Edward Oram, wrote that it was a million-to-one chance that this one shark, in all the sea, should have been placed in an aquarium.\n\nLater books and features filled the gaps. Some treat Brady as the killer. He was acquitted; do not call him the killer. Some invent a confession in which Brady arrives at Holmes’s house with the arm. That is not a courtroom finding. Alex Castles later offered the opinion that Eddie Weyman, a man Smith had informed on, was a likely suspect for Holmes’s death. That is an author’s opinion, not a conviction. Graphic reconstructions of a trunk in the bay are later color. The documented case is an arm cut off with a blade, a man missing since 7 April, a second death on the morning of an inquest, and two files that never produced a guilty verdict.",
    "mustKeep": "Aquarium incident 25 Apr 1935 (Anzac Day), Coogee. Victim James Smith; tattoo of two boxers; missing since 7 Apr. Arm severed by a blade, not a bite. Body never recovered. Holmes found shot 12 June 1935, Dawes Point (20 May was his harbour suicide attempt, not his death). Patrick Brady charged and acquitted — do not call him the killer. No conviction for Smith’s death.",

    "story": "On 23 May 1901 in Poitiers, France, the prosecutor ordered a search of a respectable townhouse after an anonymous letter said a woman had been locked inside for twenty-five years. The house was the Monnier family’s, at 21 rue de la Visitation. Commissioner Bucheton went that afternoon with officers. Louise Monnier, then about seventy-five and a widow, was in the house. Her son Marcel — a doctor of law and a former official — lived in a neighboring property and was brought into the inquiry.\n\nPolice found Blanche Monnier, then fifty-two, on an upper floor. She had been born 1 March 1849 into a conservative bourgeois family. Her father, Charles-Émile, had been dean of the Faculty of Letters at Poitiers and had been dismissed at the time of the crisis of 16 May 1877. He died in 1882. Blanche had not been seen in public since the mid-1870s. Louise and Marcel had gone on with their lives in the same compound.\n\nLouise was arrested. She died in prison about fifteen days later. Marcel was tried in October 1901. His hearing opened at the palais de justice on 7 October. The correctional court in Poitiers convicted him on 11 October and gave him fifteen months, treating his silence as complicity in acts of violence. About two thousand people were reported outside when the judgment was announced. He appealed at once. On 20 November the court of appeal acquitted him. French criminal law then punished acts of violence, not a failure to help. The 1810 penal code had no offence that fitted standing by. The appeal court held that omission — a failure of care or of watch — could not be treated as the active violence required by the statute. The court blamed his conduct toward his sister and still let him go.\n\nEarly papers, including the New York Times in June 1901, said she had been hidden over a forbidden engagement. Local rumor named a republican lawyer, later given as Victor Calmeil, and a royalist family that would not accept him. Later court discussion also described long illness in that household. Servants’ testimony at the appeal treated her as an “incurable” sick woman to whom ordinary care had come to seem useless. Neither the sweetheart story nor a single medical label is a proven motive. The letter-writer was never identified. Later popular accounts name a lieutenant as the author after a servant’s disclosure. That is speculation.\n\nBlanche was moved into care. She died at the public asylum in Blois in October 1913. Marcel sold most of the inheritance, kept the Visitation house for a time, and died in June 1913 at Migné. The house number is now 23 rue Henri Pétonnet.\n\nThe case is still taught in francophone law faculties as a problem of commission by omission. Jean-Marie Augustin’s later history treats the early love-story as press, not as the court’s reason. What later retellings added is contamination. The 1901 press photograph, the weight figures, and the inventory of the room are newspaper spectacle, not material for a script. The phrase “beautiful girl in a dungeon” is the same press line. Rats, scraps, and invented last words are texture that is not a court finding. The documented case is a woman out of public view for about twenty-five years, an anonymous letter, a mother who died in custody, a brother convicted and then acquitted because the code had no crime of standing by, and a death in an asylum twelve years after the door was opened.",
    "mustKeep": "Found 23 May 1901, Poitiers, after an anonymous letter. Blanche Monnier, born 1 March 1849; about 25 years out of public view. Mother Louise died in prison ~15 days after arrest. Marcel convicted 11 Oct 1901 (15 months), acquitted on appeal 20 Nov 1901. Blanche died Oct 1913, asylum at Blois. The “locked up for love of a poor lawyer” line is early press rumor, not a courtroom finding.",

    "hook": "A 1910 London murder in which wireless telegraphy let Scotland Yard arrest a fleeing couple as their liner approached Quebec.",
    "story": "Cora Crippen, who performed as Belle Elmore, was last seen after a gathering at 39 Hilldrop Crescent, Holloway, London, on 31 January 1910. Her husband, Hawley Harvey Crippen, was an American homeopath, small and spectacled, who had come to London in the 1890s and worked in patent-medicine offices. One of those offices was the Drouet Institute for the Deaf, where he hired a typist, Ethel Le Neve, around 1900. The couple had moved to Hilldrop Crescent in 1905 and taken lodgers. Friends of Cora’s from the music-hall world later said he first told them she had gone to America, then that she had died there. Le Neve moved into the house. After Cora vanished he was seen with Le Neve at a Music Hall Ladies’ Guild event, which is what pushed her friends to Scotland Yard.\n\nInspector Walter Dew interviewed Crippen in July. Crippen first told Dew a story that Cora had left him, then he and Le Neve left the country. Police searched the house again. In mid-July, on a search dated 12–13 July in later accounts, they found human remains under the cellar floor. Home Office analyst William Willcox reported traces of hyoscine hydrobromide. Warrants went out on 16 July. The pair had already reached the Continent. On 20 July they boarded the Canadian Pacific liner SS Montrose at Antwerp, traveling as Mr Robinson and Master Robinson. Le Neve was dressed as a boy.\n\nCaptain Henry Kendall recognized them from descriptions that had reached the ship. Before the Montrose steamed out of wireless range, a Marconi operator, Lawrence Ernest Hughes, telegraphed London. The message, as later printed, said Kendall had strong suspicions that Crippen and an accomplice dressed as a boy were among the saloon passengers. Dew crossed on a faster ship, the Laurentic, and was waiting in the St. Lawrence. He arrested them on 31 July 1910 as the Montrose approached Quebec. It was the first time wireless telegraphy was used to catch a fleeing suspect. They were brought back to England.\n\nCrippen was tried at the Old Bailey in October 1910 for Cora’s murder. Pathologist Bernard Spilsbury gave evidence about a mark on a piece of skin that the Crown said matched an operation Cora was known to have had. The jury convicted after about twenty-seven minutes. Crippen was hanged at Pentonville on 23 November 1910. Le Neve was tried as an accessory and acquitted.\n\nLater papers, including a 2007 DNA study of the remains, have argued that the cellar tissue did not match Cora’s maternal line. Those claims have been disputed. The 1910 verdict was never overturned.\n\nCreepy extras that are not the case: invented dialogue for Dew’s greeting on the Montrose; a portrait of Cora as a “nightmare wife,” which is period gossip recycled as fact; and the idea that the later DNA papers are an official exoneration. They are not. Crippen’s work was in quackish patent medicine, not a Harley Street practice. The unique, undisputed fact is the wireless interception. The rest of the file is a missing woman, remains under a cellar, a flight under false names, a conviction, an acquittal for the typist, and a verdict that still stands. The Atlantic was supposed to be large enough. With a Marconi set on the ship, it was not.",
    "mustKeep": "Cora (Belle Elmore) last seen 31 Jan 1910, 39 Hilldrop Crescent. Remains under the cellar, mid-July 1910. Flight: Antwerp, SS Montrose, 20 July; Le Neve in boy’s clothes. Captain Henry Kendall; wireless to London; Inspector Dew on SS Laurentic; arrest 31 July 1910 approaching Quebec. Crippen guilty Oct 1910 (~27 minutes); hanged 23 Nov 1910, Pentonville. Le Neve acquitted. First capture of a fugitive by wireless — not in dispute.",

    "hook": "A Mapuche and Chilote blood-drinker, usually a winged serpent, that dries livestock and people with a whistle and a paralyzing gaze.",
    "story": "The Piuchén, also called Peuchén, Piwuchén, or Piguchén, is a blood-drinking creature from Mapuche and Chilote folklore, known across much of Chile and into southern Argentina. Its Mapudungun name is often glossed as “to dry people,” from piwn, to dry, and che, people. In Mapuche tradition it usually takes the form of a winged serpent, or a lizard with bat wings, that flies at night and sucks the blood of sleeping livestock and, less often, humans. It announces itself with a piercing whistle or hiss. Its gaze can paralyze prey. Herders blame it for sheep and goats found dead without a wound. It is a forest being, said to prefer the season when the roble sprouts, and in heat it clings to bark so that dribbled blood can be found under the tree.\n\nLocal descriptions vary, and they should be flagged as local. Near Santiago, Julio Vicuña Cifuentes’s 1915 oral collection and later compilers give a bristled black snake about half a metre long whose spines poison on contact. In Talagante it is a snake that later becomes a large hairy frog with short wide wings for short flights. In Melipilla an old snake becomes a bird the size of a young turkey; red droppings mark the trunk where it hides by day. In Coinco it is a hen-sized bird with a long thin beak, pale grey eyes, and bristles along the spine, and it sucks mules. In Vichuquén it is a snake with wings “perfectly covered with feathers.” In Ovalle it has been given a parrot’s beak, a toad-like body, and a snake’s tail. It is also called a shapeshifter. Tomás Guevara and Ricardo Latcham treated the piguchén as one of the most widespread peasant myths in Chile, ancient and of Indigenous origin, even where Mapuche settlement itself did not reach.\n\nFélix de Augusta’s 1916 Araucano-Spanish dictionary records that if it infests a house, the residents die unless they flee across running water, and that only a machi can reliably defeat it. That is the folk counter that can be sourced: running water, and a Mapuche healer. There is no single canonical look to draw.\n\nThe same Spanish word names the common vampire bat, Desmodus rotundus, which folklorists treat as a likely source of the blood-and-livestock lore. That overlap is linguistic and ecological, not proof that every story is “just a bat.” Later cryptid writing and internet lists recast the Peuchen as “Chile’s chupacabra” or a generic dragon. Those labels are not the Mapuche or Chilote story. Chilote usage can also call a piguchén a supernaturally deformed object, including a sorcerer punished by being thrown into a torrent. That is a regional second meaning, not the winged serpent of the central valleys.",
    "mustKeep": "Name variants Piuchén/Peuchén/Piwuchén from Mapudungun, often “to dry people”; usual form is a winged serpent or bat-winged lizard, not a generic dragon; whistle or hiss plus a paralyzing gaze; livestock blood is the common prey, humans less so; Augusta 1916: flee across running water, machi can defeat it; the word also names Desmodus rotundus.",

    "story": "La Tunda is a shapeshifting forest being of Afro-Colombian and Afro-Ecuadorian Pacific-coast lore, especially in Chocó, Tumaco, and Esmeraldas. She is not a generic Latin American witch. She lures people — often children, or men working in the jungle — by taking the form of a loved one, typically a mother. The disguise is imperfect: one foot is a wooden molinillo, the kitchen whisk used to stir chocolate or aguapanela, and she works to hide that defect. Once a victim follows her into the forest, she feeds them river shrimp and holds them in a dazed state called entundamiento; a person so held is entundado. Adalberto Ortiz wrote that she attracts them by various deceits and “entunda” them: “This is the word. There is no other.” The trance is the point. The entundado learns to stay, and to refuse human rescuers.\n\nRescue traditionally needs godparents, drums — bombo and cununo — prayer, dogs, and sometimes gunshots or firecrackers to frighten her off. Holy water appears in church-inflected tellings. Communities still treat her as a visión that polices children who wander and adults who enter the monte after dark. Other versions say she appears as a beautiful woman to loggers and hunters, then shows a monstrous form and drinks blood or eats the man. Some say she takes the unbaptized and the disobedient. Those are parallel uses of the same figure, not a single plot.\n\nWritten records cluster in the twentieth century; nineteenth-century mentions exist, and Ortiz used her in La entundada (1971). Décimas from Tumaco, including Francisco “Pachín” Carabalí’s “La tunda brava,” keep the molinillo foot as the giveaway: look at the feet and run. Afro-Ecuadorian educator Ibsen Hernández Valencia has argued that the women behind the story were cimarronas, runaways, and that entundamiento was ideological instruction in the forest; the wooden leg, in that reading, remembers the punishment of cutting a foot from a recaptured escapee. That is a scholarly interpretation     "story": "A jiangshi is a reanimated corpse in Chinese folklore. The name means “stiff corpse,” not “vampire.” Qing writers made the literary type. Yuan Mei’s Zi Bu Yu (1788) and Ji Xiaolan’s Yuewei Caotang Biji (1789–1798) listed causes: a fresh corpse returning; a long-buried body that will not rot; leftover po, the earthly soul, taking the body after the hun has left; lightning or a cat leaping a coffin; delayed burial that lets the corpse absorb yang qi. Yuan Mei wrote that a person’s hun is good and the po evil; when the hun departs and the po stays, the body can walk. In folkloric accounts they are greenish-white, long-haired, and ferocious, able to run or even fly. An older formula says they come from the hills “to devour the infants of the people.” They drain life-force, qi, more than blood.\n\nThe hopping Qing official with a paper talisman on the forehead is a Hong Kong-cinema image, locked in by 1980s films such as Mr. Vampire. Older texts do not require the hop. A likely social source for the later look is Xiangxi “corpse-driving,” 赶尸: dead migrant workers in western Hunan were bound upright to bamboo poles and carried home at night so the family grave could take them. From a distance the bodies seemed to hop. Taoist priests were said to walk the dead home after dark, ringing bells so the living would not look. Night transport and the need to be buried with kin are documented custom. They are not proof of sorcery.\n\nCounters in the folk and Daoist kit include peach wood, a rooster’s crow, mirrors, glutinous rice, a fulu talisman on the forehead, and a raised door threshold that a rigid body cannot step over. Yuan Mei has ghosts withdraw at a rooster’s call. Fire destroys the corpse. Black-dog blood and jujube seeds nailed into the back appear in later compilations. Because the cinema jiangshi hops with stiff legs, popular writing treats the threshold as a hop-blocker; the raised sill is older domestic architecture.\n\nDo not invent a single “hopping curse.” Keep burial custom and Maoshan ritual distinct from comedy kung-fu. The Qing literary jiangshi can sprint. The hopping mandarin in official robes is what late-twentieth-century film sold to the world.\n\nRepublican-era and later popular writing mixed Xiangxi corpse-driving, Maoshan “ghost-catching,” and the Western vampire into one hopping night-feeder that fears daylight and spreads corpse-poison by a scratch. Glutinous rice as a cure for that scratch belongs to this later blend. Yuan Mei’s anecdotes are stranger and less standardized: a flying corpse, a corpse undone by greed, a corpse that asks for food. After him, jiangshi became the ordinary literary word for the walking dead. Ji Xiaolan’s notebook tales sit in the same late-eighteenth-century moment. Together they are the written peak, not a prehistoric hopping curse.\n\nWhen a script needs a look, use the Qing text first: stiff, pale or greenish, long-haired, fast. Put the Qing hat, the outstretched arms, and the yellow forehead slip in a separate sentence, and call them cinema.",
    "mustKeep": "Literal sense is “stiff corpse,” not “vampire”; Qing sources are Yuan Mei 1788 and Ji Xiaolan 1789–98; folklore form can run or fly, hopping is later; they feed on qi more than blood; Xiangxi corpse-driving is a social origin, not proof of sorcery; Qing robes and forehead talisman are cinema.",

    "hook": "The revenant of a woman who died in childbirth or a cruel death, with backward feet, who drains the men of her household until they wither.",
    "story": "The churel, also chudail or churail, and petni or shakchunni in Bengal, is the revenant of a woman who died in childbirth, pregnancy, or the so-called impure days after birth, or who died a cruel or unnatural death. William Crooke, in An Introduction to the Popular Religion and Folklore of Northern India (1894), called her “the ghost of the unpurified mother.” She is made by that death, not by generic wickedness. In her true form she is hideous: a black tongue, thick lips, clawed hands, sometimes a fair front and a black back. She invariably has her feet turned backward. That is the giveaway. She shapeshifts into a beautiful woman and lures men, especially the males of her own family if they mistreated her, draining blood or virility until they wither into old men. Victims age. They do not sprout fangs. She haunts peepul trees, crossroads, and cremation grounds.\n\nFamilies try to stop her return. Crooke and later compilers record a set of counters: carry the corpse out a side door, not the front; sprinkle mustard seed (sarson) along the road to the burial ground so she stoops to count it until sunrise, or so the blossoms please her in the other world and she does not come home; bury rather than cremate; weight the grave with thorns and stones; bind the toes with iron. Iron and mustard are the household tools. Regional names include pichal peri or pichhal pairī, “reverse-footed,” in Punjab and the northwestern mountains, where the backward feet are the whole name. In some of those tellings she waits in woods for lone men and is exposed only when someone looks down. The figure overlaps with the Malay pontianak as a cousin type — a childbirth revenant — not the same story.\n\nThe word is also used loosely for “witch,” and churel accusations have been turned against living women, including Dalit and Adivasi women. That social use is part of the record. It is not a license to treat “impure mother” as fact. The menstrual and caste language in the older ethnography is the ethnographers’ and the villagers’ prejudice, not a natural law.\n\nLater Hindi cinema and television made the chudail a long-haired seducer in white, close to a generic Indian ghost. Internet horror has mixed her with the pichal peri as a creepypasta. The folk counters — mustard, iron, the side door, the weighted grave — and the backward feet are older than that costume. Do not eroticize the feeding, and flag that pontianak is already in this archive as a related type.\n\nCrooke’s 1894 book is colonial ethnography, useful for the counters and the “unpurified mother” label, not for a single canonical portrait. Later South Asian collections keep the backward feet even when the rest of the body changes. If a script needs one visual rule, use that: look at the feet before you take a beautiful stranger’s hand on a night road.",

    "story": "Madam Koi Koi is a Nigerian boarding-school urban legend, also told in Ghana as Madam Moke. The name is the sound, not a personal name. A stylish, cruel teacher known for red high heels walks the corridors; the shoes click “koi koi.” In Ghana, moke is a word for high heels, so Madam Moke is the same joke in another language. Related school-heel ghosts are reported as Madam High Heels and, in some Tanzanian tellings, Miss Konkoko. There is no single documented school of origin and no dated first report. The story spread as students moved between Federal Unity Colleges and other boarding schools. It functions as a curfew tale.\n\nIn the most common Nigerian version she slaps a student, damages the girl’s ear, is dismissed, dies in a road accident on the way home, and swears revenge. After lights-out, students hear heels in the hostel halls. Anyone who looks at her face is said to vanish. A darker variant has students beat her to death and dump the body; the boy who struck her with the shoe is later found dead. In some tellings she is missing one heel and demands it back. She opens doors, slaps students, and attacks toilets. In day schools she targets those who arrive too early or leave too late. She may be invisible except for the heel. The two deaths — road accident after dismissal, or students kill her — should not be merged into one “true” origin. Neither is a documented murder.\n\nA Ghanaian coloring sometimes has her die in a crash while chasing a student, leaving one heel behind. That is a variant, not a second historical case. The constant across versions is the sound in a dark hostel and the rule against looking at her face.\n\nNetflix’s The Origin: Madam Koi-Koi (2023) is a loose Nollywood adaptation, not the folk version. School-lore tellers already complain that the series gave her a plot the dormitories did not share. Older students pass the story as a reason to stay in bed after lights-out. It is student lore about cruelty, corporal punishment, and night-time fear in real boarding schools. Do not present either origin as a documented killing, and do not turn the ghost into a sexualized “hot teacher.” There is no verified historical teacher under that name.\n\nSouth African school lore has a different toilet and corridor terror, Pinky Pinky; some internet lists fold that name into Madam Koi Koi. They are not the same figure. Keep the Nigerian and Ghanaian heel-ghost in the hostel, and leave Pinky Pinky out of this entry.\n\nWhat later culture added is a face and a plot. The folk story is mostly a sound after lights-out, a missing heel, and a rule: do not look.",

    "story": "Among the Ewe of Togo, Ghana, and Benin, adze is not first a monster species but a night-going force tied to witchcraft. An adzetɔ, “one who has adze,” is said to send that force out while the body sleeps. In insect form — firefly, beetle, mosquito, or a bead of light — it slips through keyholes and wall cracks, drinks the blood of sleepers, and prefers children. Victims sicken and may die. If captured, it takes human shape and can possess a living person. People so possessed are spoken of as witches. Accusations fall on the envious, the poor, the old who outlive the young, and especially women, including co-wives and the infertile. The harm is felt by the host’s family or by those the host is said to envy.\n\nJakob Spieth, a Bremen Mission ethnographer, recorded the belief in Die Ewe-Stämme (1906) and Die Religion der Eweer in Süd-Togo (1911). He gave only a few pages, but they are the early written record. Diedrich Westermann’s Ewe dictionary of 1905–1906 has the lexical entry. Later missionary and Pentecostal language folded adze into Christian talk of the Devil; Birgit Meyer has written about that translation. There is no traditional charm that reliably stops an adze. Some church households answer an owl — sometimes called a witchcraft-bird — with the Lord’s Prayer. That is a Christian overlay, not an old Ewe talisman.\n\nHistorians treat the insect-and-fever pattern as an older way of talking about malaria. That is a modern reading, not the folk explanation. The “vampire firefly” label is largely a twentieth-century Western encyclopedia gloss, popularized by Matthew Bunson in 1993 and repeated in monster handbooks. In Ewe understanding the adze is a condition a person can have, not a wild animal that happens to look like a bug.\n\nThe belief remains active. Meera Venkatachalam documented ongoing accusations and church deliverance sessions in southeastern Ghana. Witchcraft accusations still harm people, especially women. Do not treat witches as fictional monsters or offer “how to catch” instructions as if they were sport. The useful sentence for a script is the one the ethnography supports: a light that comes through a crack, a child who does not wake well, and a community that already has a name for who sent it.\n\nA 1935 note on Glidyi Ewe, published in Africa, glosses adzé as a witch spirit and adzétɔ as the person who has it, and compares the word to Yoruba adzé. In that account the witch leaves the body at night as a snake leaves a skin, walks emitting fire from the eyes or mouth, and may go with the head down or the feet turned backward. It kills by sucking blood at night or by taking a shadow at noon. That is one dialect description, not a continent-wide standard. Keep it flagged as Glidyi. The shared core across the sources is still the same: a force that leaves a sleeping body, a small light or insect at the wall, and a child who does not thrive.",

    "hook": "A Caribbean skin-shedder who leaves her hide in a mortar, flies as a ball of fire, and sucks blood through keyholes.",
    "story": "In Trinidad and Tobago and across the eastern Caribbean, the soucouyant — also soucriant; Ol’ Higue or Old Hige in Guyana and Jamaica; asema in Suriname; loogaroo in some French-influenced islands — is a person, usually a reclusive old woman, who by day looks ordinary. At night she sheds her skin, leaves it in a mortar, and flies as a ball of fire. She enters houses through cracks and keyholes and sucks blood from sleeping people, leaving bruises on arms, necks, legs. If she takes too much, the victim dies or becomes a soucouyant. Some say she trades the blood with Bazil, a demon in the silk-cotton tree, for power. She belongs to the wider class of jumbies.\n\nTo catch her, scatter rice: she must count every grain, at the house or at a crossroads, and dawn may find her still counting. To kill her, find the skin and rub it with coarse salt or pepper so she cannot put it back on before sunrise. She itches, burns, and dies. Some tellings say the skinless form cannot stand the sun. Giselle Liza Anatol, whose family is Trinidadian, retells the household version: salt or pepper in the hiding place; rice or salt on the sills; if neighbors catch her counting, they beat her or drop her in tar. Edgar Mittelhölzer’s novel has her break her back bending for every grain. Variants allow men and younger people; the old-woman form remains the core Trinidadian type.\n\nFolklorists treat her as African–European syncretism: Yoruba àjé and Akan obayifo night-witches meeting French vampire and loup-garou lore. Anatol’s The Things That Fly in the Night is the standard modern treatment of circum-Caribbean female vampires. The figure was used to keep children obedient and to mark solitary older women as takers rather than givers. That social edge is part of the story. Do not present rice-and-salt methods as a how-to, and do not collapse her into a generic European vampire or into the already-archived pontianak.\n\nLater carnival, tourist copy, and fantasy novels give her a glamorous fireball and a fixed island of origin. The folk type is smaller: a neighbor by day, a skin in a mortar, a light in the sky, and a pile of rice that takes until morning.\n\nAnatol grew up hearing “soucouyant gon’ come for you” as a chill that did not wait for bad behavior: anyone’s blood could lure her. That is the household use. Island plays still put her on stage with other jumbies. Belief is reported as thinner in some places and still current in others, including parts of Guyana, Suriname, Dominica, and Trinidad. When a script needs a look, use the old woman, the mortar, and the fireball. Leave the silk-cotton bargain in a sentence that says some tellers add it. Leave the European cape and fangs out.",

    "story": "In East Slavic folklore, especially Ukrainian, a rusalka — also called a mavka — is not a mermaid with a tail. She is a young woman with loose, often green or fair hair, naked or in a white shift, sometimes wearing a sedge wreath, the unrest soul of a drowned girl, an unbaptized child, or a woman who died before her time. Dmitry Zelenin, in 1916, classed rusalki with the “unclean dead,” založnye pokojniki: those who died untimely or unnatural deaths and were not put to rest. Until then, dictionaries had called them Slavic nymphs or Russian naiads and drawn them with fish tails. Village ethnography did not. They have legs. They live in rivers and, in Belarusian and some field lore, also in woods and rye. They are as terrestrial as they are aquatic: they sit on birch and willow, run the meadows, and visit houses.\n\nThey are most dangerous in a calendar week, not on a random night. During Rusalka Week — Rusal’na nedilia, Green Week, the days around Pentecost — they leave the water, swing on branches, and dance. Swimming that week is forbidden. They lure men with song and tickle them to death or drag them under. Russian nicknames include loskotukha, “the tickler.” Their dancing is also said to help the rye grow. The Encyclopedia of Ukraine says they play until St. Peter’s day, then return to the rivers or rise into the sky after the first thunder. Protection includes wormwood, lovage, and a charmed shirt or cloth. At week’s end, villages practiced a ritual banishment or “burial” of the rusalki, still done as entertainment into the 1930s. In the Chernihiv region a girl in veil and red costume was led about as a rusalka on the eve of Green Thursday.\n\nThe name comes from rusalija, the Slavic form of Latin Rosalia, the Pentecost season of roses, not from “Rus’” or Russia. Ukrainian mavka / navka is related to Old Church Slavonic navь, a soul of the dead. In some regions the bookish word rusalka was less common than mavka, kupalka, or the tickler names. Nineteenth-century literature and opera — Dargomyzhsky, Dvořák’s Rusalka — turned her into a seductive mermaid who wants a human soul. That is art song, not village belief. Do not invent one tragic backstory for every rusalka, and do not recast a fertility-and-death spirit as a Disney mermaid or a Polish banshee.\n\nWhen a script needs a look, use legs, loose hair, a shift or nothing, a riverbank in Green Week. Put the fish tail in a sentence that says literature added it.\n\nZelenin’s argument, re-read a century later by ethnologists, is that these beings make sense in the Orthodox year: a week when the unripe dead are allowed out so the crops can pass a liminal stretch. That is scholarship about function, not a village plot. Village rules stay simple. Do not swim in Green Week. Carry wormwood. If you hear singing from the water, do not answer it as if it were a living girl.",
    "mustKeep": "Legs, not a fish tail, in folk belief; origin is untimely or watery death, including unbaptized children; most dangerous in Rusalka / Green Week after Pentecost; they tickle or drown men and also bless crops; name is from Rosalia/Pentecost, not Russia; mermaid image is 19th-c. literature; Ukrainian cousin name is mavka.",
    "sensitivity": "These stories rest on drowned women, suicide, and dead infants. Do not invent one tragic backstory for every rusalka, and do not recast a fertility-and-death spirit as a Disney mermaid or a Polish banshee.",
