    "hook": "The Korean ghost of a woman who died unmarried, bound by han, wearing white mourning clothes and loose hair until a soul wedding releases her.",
    "story": "A cheonyeo-gwisin, also songaksi, malmyeong, or sonmalmyeong, is the ghost of a young woman who died unmarried in Korean folk belief. Under Joseon Confucian order, a woman’s life was defined as daughter, wife, and mother. Death before marriage left han — accumulated grief and resentment — that bound the soul to this world. She is defined by that unfinished life-script, not by a single murder plot. She is usually shown in white mourning clothes, sobok, with hair hanging loose, because only married women wore the hair up. Older descriptions can make her neat and almost human. In the classic Janghwa Hongryeon jeon, Hongryeon appears before a governor as “a beautiful woman dressed in a green jacket and a scarlet skirt” who bows; he has to ask if she is human or demon. The horror of a virgin ghost who died with a grudge is also in Seo Yu-young’s Geumgye pildam (1873). Later Korean horror film made the pale, long-haired, floating figure standard. That dripping-hair look is cinema, not the Joseon default.\n\nShe attaches to girls her own age, ruins households, haunts newlyweds, and brings illness. Families may enshrine her in a small wall box or door gap and treat her as a dangerous household spirit. The male counterpart is the chonggak-gwisin or mongdal-gwisin, also called samtae in some ritual speech. The usual remedies are a shamanic exorcism or a soul wedding, yeonghon gyeolhonsik or sahonje, that marries a virgin ghost to a bachelor ghost so both can leave. The Encyclopedia of Korean Culture describes heojaebi-gut: straw or dummy figures of the dead couple are married inside a larger rite for restless souls, especially in Yeongnam and Honam, often for the unmarried drowned. The point of the wedding is not romance. It is to seat the dead as ancestors. Folk practice also placed phallic straw figures in the coffin or erected phallic statues; some remain at Haesindang Park in Samcheok.\n\nThe English label “virgin ghost” comes from that patriarchal life-script. Do not mock soul weddings or living Korean shamanic practice, and do not paste on The Ring as if it were the Korean source. Ringu and its American remake drew on Japanese onryō cinema. Korean film later used the same wet hair. The folk type is older: an unmarried dead woman, han, white clothes or a surprisingly human face, and a wedding or a gut that lets her go.\n\nGwangju and other Korean-English explainers still stress the same social fact: a woman who died before the roles assigned to her could not become a proper ancestor, so the household had to house her or marry her off in death. Modern school-horror and webtoons reuse the white clothes and loose hair for a murdered classmate. That is a new plot laid on an old type. If a script needs the folk cause, use the unmarried death and the han, not a slasher origin.",
    "mustKeep": "She is defined by dying unmarried, not by a single murder plot; han is the binding emotion; sobok and loose hair mark the unmarried dead; older texts can make her look human, the dripping-hair film look is later; male counterpart is chonggak/mongdal-gwisin; release is exorcism or a soul wedding, not a Hollywood slaying.",

    "hook": "A corporeal Icelandic revenant that walks from the mound, swollen and death-blue, and has to be beheaded and burned to die a second time.",
    "story": "In medieval Icelandic sagas, a draugr — also haugbúi, mound-dweller, or aptrganga, again-walker — is a corporeal revenant, not a transparent ghost. The dead person, often greedy, unpopular, or found sitting upright, returns in a swollen, death-blue or corpse-pale body that stinks, has superhuman strength, and can swell, shapeshift, ride roofs, drive animals mad, and start a chain of further deaths. Sitting or standing corpses are a warning that the dead may walk.\n\nGrettis saga, written in the fourteenth century about an eleventh-century outlaw, gives two set pieces. Grettir breaks into the barrow of Kárr the Old, who has haunted an island and driven farmers off. They wrestle among horse-bones until Kárr falls; Grettir cuts off the head and lays it at the thigh, then takes treasure, including a sword. The saga calls Kárr a draugr. Later Grettir fights Glámr, a Swedish shepherd hired to a haunted farm, who refused the Yule fast, was found dead in the snow, could not be moved to church, and then walked, breaking bones and emptying the district. Grettir throws him, and as Glámr dies a second time he curses Grettir with outlawry, failing strength, and a terror of the dark. The saga never actually calls Glámr a draugr — it uses “troll” — though scholars do. Say that on camera.\n\nEyrbyggja saga’s Þórólfr Twist-Foot sits dead on his high-seat, then kills livestock and people. A shepherd is found coal-black with every bone broken near the cairn; birds that land on the grave fall dead. When the corpse is dug up it is unrotten, “blue as hell, and big as a neat.” Fire is slow to take it. Prevention in later Icelandic custom includes carrying the body out a special corpse-door so it cannot find the way home, pinning the feet or tying the toes, and placing open iron scissors on the chest. Destruction in the sagas is to wrestle the body down, cut off the head, burn it, and scatter the ashes.\n\nLater Norwegian folklore splits the word into a land revenant and a sea-draug of the drowned, with a head of seaweed in a half-boat. That is a later split, not the saga type. Video games and “Viking vampire” lists add blood-drinking the sagas do not describe. Keep the medieval Icelandic walking corpse distinct from those.\n\nEyrbyggja also shows a legal remedy for a house full of walkers: a door-doom, a court at the doorway, after which the dead are judged out and the house is purified. That is saga law, not a folk charm you can carry in a pocket. When a script needs a look, use the swollen blue body and the mound or the farm roof. Leave the seaweed head for a sentence that says Norway later split the word. Leave Skyrim’s Draugr in the pop-culture clause.",
    "mustKeep": "Corporeal corpse, not a see-through ghost; death-blue or corpse-pale and swollen; mound-guardian and farm-haunter are both attested; Grettir vs Kárr and vs Glámr are the main saga scenes; Glámr is not named draugr in the text; second death is behead, burn, scatter; Norwegian sea-draug with seaweed head is a later split, not the saga type.",

    "hook": "Two farm workers were convicted of murdering a shepherd who, years later, walked back into the village alive and asked for his baptismal certificate so he could marry.",
    "story": "In August 1910, José María Grimaldos López, a shepherd from Tresjuncos in Spain’s Cuenca province, sold some of his sheep and vanished. The date later fixed in the file was 21 August. He worked on a farm, El Palomar, at Osa de la Vega. His family accused two coworkers — farm overseer León Sánchez Gascón and watchman Gregorio Valero Contreras — of killing him for the money. There was no body.\n\nA first inquiry was closed in 1911 for lack of evidence. In 1913 magistrate Emilio de Isasa, at the Belmonte court, reopened the file and ordered the two men detained. Under violent Civil Guard interrogation they confessed to a murder and to destroying the remains. A death certificate was issued that noted the corpse had never been identified because it had never been found. The interrogations happened; they are not a scene to restage.\n\nIn 1918 a jury at the Audiencia Provincial de Cuenca convicted both men and sentenced them to 18 years. The jury was out about half an hour. Valero was sent to the prison of San Miguel in Valencia; Sánchez to the central prison at Cartagena. They served years of the term and were released in July 1924 under pardons. Their families carried the stigma of a murder that had not been shown by a body.\n\nIn February 1926 the parish priest of Mira, at the other end of the province, wrote to Tresjuncos asking for Grimaldos’s baptismal record: the missing man was alive and wanted to marry. The Tresjuncos priest, Pedro Rufo Martínez Enciso, received the letter. Grimaldos then appeared in person. He was identified. He said he had not known of the case. On 19 February 1926 he was brought before the Belmonte judge for that identification. Photographs of him were taken on 7 March 1926 at the judge’s request.\n\nThe affair was used in the press against the Primo de Rivera dictatorship. The minister of Grace and Justice, Galo Ponte y Escartín, ordered a review. A ministerial note said there were grounds to think the confessions, the essential basis of the convictions, had been obtained by “violencia continua inusitada.” On 10 July 1926 Spain’s Supreme Court voided the 1918 sentence, stating that a crime that had never been committed had been punished, and declared Valero and Sánchez innocent. The death certificate was also nullified. The Court treated the review remedy flexibly: the men were no longer in prison, but the error was still to be corrected.\n\nLater attempts to prosecute officials and Civil Guards involved in the original file ended in acquittals. In 1935 the minister of justice was photographed presenting the two men with a payment. The miscarriage is cited as a reason for later changes in Spanish criminal procedure, including rules about homicide charges without a body that lasted, in one form, until a 2015 reform.\n\nThe events were in Osa de la Vega and Tresjuncos, province of Cuenca — not the city of Cuenca. The name “crimen de Cuenca” was popularized in 1926 newspaper writing, then by Pilar Miró’s 1979 film, which was held back in 1980 and released in 1981. The film is not evidence. Grimaldos’s nickname and jokes about his intelligence are later color. Do not use them. There was no murder. The living man asked for a baptismal certificate so he could marry.",
    "mustKeep": "1) There was no murder and no body. 2) The missing man was José María Grimaldos; the convicted men were León Sánchez and Gregorio Valero. 3) First inquiry closed 1911; case reopened 1913; jury conviction and 18-year sentences in 1918. 4) Grimaldos was found alive in 1926 after a priest in Mira requested his baptismal record for a marriage. 5) Supreme Court annulled the convictions on 10 July 1926. 6) The events were in Osa de la Vega and Tresjuncos, province of Cuenca—not the city of Cuenca.",
    "sensitivity": "Do not dramatize the interrogations. Do not mock Grimaldos’s nickname or intelligence. Do not treat Pilar Miró’s 1979 film as evidence. A child is not involved; keep the focus on the wrongful convictions and the living ‘victim’.",
    "sources": [

    "id": "pyjama-girl",
    "title": "The Pyjama Girl case",
    "country": "Australia — Albury, New South Wales",

    "countryShort": "Australia",

    "year": "1934–1944",
    "hook": "A burned, unidentified woman found in a roadside culvert was kept in a formalin bath and shown to the public for a decade before police named her and her husband was convicted of manslaughter.",
    "story": "On 1 September 1934 the burned body of a young woman, dressed in pyjamas, was found in a culvert beside Howlong Road near Albury, New South Wales, on the New South Wales side of the Victorian border. She could not be identified. The remains were preserved in formalin in a zinc-lined bath at the University of Sydney and, later, at police premises, and shown to hundreds of people who might recognize her. That public display is a fact of the investigation. It is not material to linger on.\n\nAmong those who saw the body, or photographs, was Antonio Agostini, an Italian-born waiter and journalist whose wife, Florence Linda Agostini, born Linda Platt in London, had been reported missing from Melbourne in late August 1934. The couple had been living in Carlton. He worked on the newspaper Il Giornale Italiano; she worked at a hairdressing salon. Agostini later moved to Perth in 1936 and to Sydney in 1938. In 1938 he went to police, did not identify the body as his wife, and gave them the name of Linda’s dentist — the records that first eliminated her. A 1938 inquest still failed to name the dead woman. An inaccurate dental chart, made by a local dentist without forensic experience, had led police to rule Linda out.\n\nIn February 1944 those charting errors were corrected. A new dental comparison, with matching freckles on an arm, led officials to identify the body as Linda’s. Several acquaintances were said to confirm it. On 4 March 1944 Agostini, then a waiter at Romano’s in Sydney, was interviewed by New South Wales police commissioner William John MacKay, who had known him in the 1930s. Agostini said his wife had died of a gunshot during a quarrel in their Carlton home and that he had driven the body across the state border and tried to burn it. He was taken to Melbourne, arrested on 6 March, and committed in April to stand trial for murder.\n\nTried for murder in Melbourne in June 1944 before Justice Charles Lowe, he was convicted of manslaughter and sentenced to six years with hard labour. The jury did not accept murder. Linda was buried on 13 July 1944. Agostini had been interned as an enemy alien during the war and released in February 1944. He was released from the manslaughter sentence in 1948 and deported to Italy, where he died in 1969.\n\nLater writers, including historian Richard Evans in The Pyjama Girl Mystery (2004), have argued that the 1944 identification was forced, that physical discrepancies remained, and that another missing woman, Anna Philomena Morgan, had also been a candidate. Dr Thomas Benbow contested the identification at the time. Do not present that dispute as settled, and do not present Antonio’s “accident” claim as proven fact. The official identification was Linda Agostini. The jury’s finding was manslaughter.\n\nTourism and true-crime extras treat the formalin bath as a sideshow and the 1944 file as a clean close. The documented case is a body found near Albury on 1 September 1934, ten years without an official name, a first dental chart that closed a door, a second that opened it, a husband’s statement, a manslaughter verdict, a burial on 13 July 1944, and a live argument about whether the name on the file is the right one.",
    "mustKeep": "1) Body found 1 September 1934 near Albury, not in Sydney. 2) She remained officially unidentified for about ten years; the body was preserved in formalin and shown to the public. 3) Official 1944 identification was as Linda Agostini, after a corrected dental chart. 4) Antonio Agostini said the shooting was in Melbourne and the dumping near Albury. 5) He was convicted of manslaughter, not murder, and sentenced to six years. 6) He was deported to Italy in 1948; Linda was buried 13 July 1944.",
    "sensitivity": "Do not describe burning or injuries. Do not treat the preserved body as spectacle. Later writers have questioned the identification; do not present that dispute as settled, and do not present Antonio’s ‘accident’ claim as proven fact—the jury’s finding was manslaughter.",

    "hook": "A Paris bailiff vanished; weeks later a body and a smashed trunk turned up near Lyon, and a forensic re-examination identified him after the first doctors had said it was someone else.",
    "story": "In late July 1889, Paris bailiff Toussaint-Augustin Gouffé disappeared. He was forty-nine, a widower with two daughters, and kept an office at 148 rue Montmartre. He was last seen on 26 July. When he did not come home, his housekeeper alerted his brother-in-law, Louis-Marie Landry, who reported him missing.\n\nIn mid-August a badly decomposed man’s body was found in woods near Millery, south of Lyon. A road mender followed a smell on 13 August. Pieces of a wooden trunk shipped from Paris were recovered nearby, at Saint-Genis-Laval. A key fitted the lock; a missing nail matched a nail found at Millery. A railway tag and the PLM company’s registers later tied the trunk to a Paris-to-Lyon shipment on 27 July 1889. Forensic surgeon Paul Bernard autopsied the body on 14 August and could not identify it. Washed hair later showed the first colour reading had been wrong: dirt and decomposition had made chestnut hair look black. Landry, sent from Paris, also failed to identify the remains. The body was buried.\n\nMarie-François Goron of the Paris Sûreté kept the Millery body in mind as Gouffé. He had the corpse exhumed. In November 1889, beginning 13 November, Lyon forensic physician Alexandre Lacassagne spent a week on a second examination. He compared the skeleton with Gouffé’s military and dental records and his family’s description: height about 5 feet 8 inches, age about fifty, a missing upper right molar, a deformity of the right knee and heel consistent with a limp, and hair matched to Gouffé’s brush. Lacassagne concluded the body was Gouffé’s.\n\nInquiry showed Gouffé had been seen with indebted swindler Michel Eyraud and Eyraud’s companion Gabrielle Bompard, who had left Paris about 27 July. Goron published pictures of a replica trunk. Witnesses placed the pair with the chest. A London carpenter later said he had sold them the trunk. Bompard surrendered in Paris in January 1890. Eyraud was arrested in Havana in May 1890 and extradited.\n\nAt their December 1890 trial they blamed each other. Bompard’s lawyers argued she had acted under hypnosis — a fashionable, contested defence, not a finding of fact. Both were convicted. Eyraud was guillotined in Paris on 3 February 1891. Bompard received 20 years’ hard labour.\n\nLater retellings restage the apartment, invent dialogue, and treat mesmerism as proved. They also sexualize Bompard and Gouffé. The court had a body that the first doctors said was not Gouffé, a second examination that said it was, two accused who pointed at each other, and a hypnosis argument the jury was not required to believe. Lacassagne’s identification — bones, teeth, a limp, and a hairbrush — is the part of the file that changed forensic practice and later earned him the classroom nickname “French Sherlock Holmes.” The rest is a missing bailiff, a trunk on the Lyon line, and two convictions.",
    "mustKeep": "1) Victim was Toussaint-Augustin Gouffé, a Paris bailiff. 2) The body was found near Millery, not in Paris. 3) Lacassagne’s November 1889 examination is what identified him after an earlier failure. 4) Killers were Michel Eyraud and Gabrielle Bompard; both convicted. 5) Only Eyraud was executed, on 3 February 1891; Bompard got 20 years. 6) The hypnosis claim was a defence argument, not proven.",
