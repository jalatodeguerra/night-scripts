    "hook": "A weeping woman by the water who drowned her children and now hunts the living.",
    "story": "La Llorona is a Mexican legend of a woman who walks the water’s edge at night, crying for children she killed. In the version told most often, a woman — sometimes called María — marries a man above her station. They have children. She then sees him with another woman, richer and lighter, someone he can take into a world she cannot enter. In rage she takes the children to the river and holds them under until the current keeps them. The moment they go still, she wants them back. She wades in after them. She does not come out the same.\n\nShe now walks the banks in white, hair long and black, crying “¡Ay, mis hijos!” If the cry sounds far away, she is close. If it sounds close, she is far. That rule appears in more than one country that borrowed her. Children are told to stay away from the water after dark. Night walkers are told not to follow a weeping woman toward the river. Some tellings say she mistakes living children for her own. Some say she only wants company in the dark. The people who go to comfort her are the ones who do not come home.",

    "story": "The pontianak, also called kuntilanak, is a Malay and Indonesian figure of a woman who died pregnant or in childbirth. Skeat, writing in 1900, distinguished the langsuir (a woman dead in childbirth) from the pontianak (a stillborn child); later tellings fused them. By day she may hide in a banana tree. By night she walks as a beautiful woman in white, hair down her back. The smell of frangipani comes first, then the smell of a corpse.\n\nShe announces herself with an infant’s cry or a woman’s laugh. If the sound is faint, she is near; if it is loud, she is far. Dogs howl when she is in the district and whine when she is at the fence. She finds men by the scent of laundry left out overnight. Her nails open them. She is said to take the organs, and to hunt pregnant women and infants.\n\nA nail driven into the nape of the neck — or, in some Indonesian tellings, the crown of the head — pins her. She becomes a quiet, beautiful wife until someone pulls the nail. In 1771, the first sultan of the city that took her name is said to have fired cannons into the jungle until the spirits fled, then built a mosque and a palace on the cleared ground. The city of Pontianak, Indonesia, kept the name.",

    "hook": "A short, hairy night spirit that attacks people sleeping on the floor; households raise the bed on bricks to stay above his reach.",
    "story": "The tokoloshe — also tikoloshe, uThikoloshe, or Sotho thokolosi — is a Nguni figure described as small, knee-high or hip-high, hairy, and baboon-faced. Older stories put him in rivers and reeds: a water sprite, mischievous and dangerous, able to vanish if he drinks water or swallows a stone. Later and parallel stories say a witch or a vengeful neighbor can send one. Then he is not only a river thing. He is a weapon.\n\nHe comes at night, into the house, to people sleeping on the floor. Illness. Terror. Sometimes death. The household protection is to raise the bed: bricks under each leg, sleep above his reach. Sangomas and certain pastors are asked to drive him out when bricks are not enough.\n\nMissionaries wrote the name down in the 1830s because it was already known; it is documented in English by 1833. The Dictionary of South African English still treats it as living vocabulary. City papers still run the word in headlines.",

    "story": "The Black Volga is a Polish urban legend about a GAZ Volga — the Soviet executive sedan, black as a government car — seen on a street after dark. White wheel rims. White curtains in the windows. Sometimes no plates. Sometimes the number is 666. Children were told that the car takes people.\n\nWho drives it depends on the year the story was heard. Secret police. Organ thieves. Satanists. The Devil, who rolls down the window and asks the time. If the person answers, they die on the spot, or they die at that same hour tomorrow. The counter-charm in the devil version is to say, “It is God’s time.” Then the car is gone.\n\nThe Volga was real. Party men rode in them, as did officials who were not questioned. A 1965 Warsaw kidnapping that used a black Volga gave the rumor a news hook. The rest grew as bloc rumors grew: blood sold to rich foreigners, kidneys taken for Soviet clinics. Years later the car in the story changes to a BMW or a Mercedes, but the empty back seat and the white curtains stay.",

    "hook": "A fire-breathing figure in Victorian London who used a policeman’s voice to get a door open, then leapt away.",
    "story": "Spring-heeled Jack is the name given to a figure who terrified London in 1838. In January, Lord Mayor Sir John Cowan publicized a letter from Peckham: someone in a devil’s costume was terrifying servant girls for a wager. The papers picked it up. The name was already in the street.\n\nOn 19 February, Jane Alsop answered her father’s door in Old Ford. A man claimed to be police and said they had caught Spring-heeled Jack in the lane. She brought a candle. He threw off his cloak. Eyes like red balls of fire. A helmet. Tight white oilskin. He spat blue-white flame and tore her gown with metal claws. Her sister pulled her inside. He was gone.\n\nNine days later, on 28 February, Lucy Scales walked Green Dragon Alley in Limehouse. A cloaked figure waited in the angle of the passage and put blue flame in her face. She dropped, in fits for hours. He did not touch her. He walked away.\n\nThe police never took him. Penny dreadfuls did. For the rest of the century he was said to leap mail coaches, slap sentries at Aldershot, and laugh from rooftops. The last famous claim is Liverpool, 1904. His identity is unknown. The Marquess of Waterford was a period rumor, not a conviction.",
    "mustKeep": "Best-documented attacks: Jane Alsop (19 Feb 1838) and Lucy Scales (28 Feb 1838). Traits: cloak, helmet, oilskin, metal claws, blue flame, red eyes, huge leaps. Lord Mayor Sir John Cowan publicized the panic on 9 Jan 1838. Identity unknown; Marquess of Waterford is a period rumor, not a conviction. Do not treat 20th-c. UFO Jack as the 1838 legend.",
    "sensitivity": "Core cases are assaults on teenage girls. Tell as historical panic, not titillation.",
    "sources": [

      "Mike Dash, “Spring-heeled Jack,” Fortean Studies vol. 3 (1996)"

    "hook": "A village woman who splits at the waist at night and lowers a thread-like tongue into a pregnant house.",
    "story": "Aswang is not one monster. Filipino folklorist Maximo Ramos sorted the word into five kinds: vampire, viscera-sucker, weredog, witch, and ghoul. The image that travels is the viscera-sucker — Tagalog manananggal, “the one who separates.”\n\nBy day she is a woman in the village. By night she splits at the waist. The upper body grows wings. The hips and legs stay behind, hidden, because if they are salted or turned over she cannot return. The flying half goes to the house of a pregnant woman, or a sick one, and puts down a tongue like a thread. Through the thatch, through the bamboo floor, into the body. What she wants is the liver, the unborn child, the phlegm of the dying.\n\nSpanish priest Tomas Ortiz wrote a version of this in 1731: the creature on a neighboring roof, tongue like a thread, drawing out the child. Plasencia, in 1589, already listed flying flesh-eaters among the Visayans and called the aswang the spirit people feared most. Counter-charms include garlic, salt, ash, a stingray tail, and light and noise at a wake.",
    "mustKeep": "Aswang is an umbrella word — pick manananggal and say you are picking. Self-segmentation at the waist; thread-like tongue. Documented 16th c. Capiz association is popular, not exclusive. Do not retell CIA “Huk aswang” psy-ops as folklore.",
    "sensitivity": "Still a living accusation. Do not point at a real town as “monster country.”",
    "sources": [
      "https://www.jstor.org/stable/1499218 (Ramos, 1969)",
      "Plasencia, Customs of the Tagalogs (1589)"
    ]
  },

    "hook": "An Irish death omen who keens for certain families the night before someone dies.",
    "story": "The banshee — Irish bean sí or bean sídhe, “woman of the fairy mound” — is a death omen, not an attacker. She is a woman of the sídhe, the fairy mounds that break the Irish fields. At night she keens. The sound is the sound professional mourners used to make over a corpse, except there is no corpse yet.\n\nShe is heard at the old house even if the dying person is in another country. Sometimes she is a washerwoman at a ford. Sometimes a tall thin woman in white or grey, combing her hair on a riverbank. Sometimes an old hag. The cry belongs to certain Gaelic names — Ó and Mac, the families that were here before the Normans — though later tellings let anyone hear her. Once the household admits the cry, death is coming. It cannot be bargained off.\n\nThe National Folklore Collection holds schoolchildren’s copies of this: she follows the O’s and the Macs; she is heard the night before; she is not a figure people want to see.",

    "sources": [

    "story": "In Greenbrier County, West Virginia, in 1897, Elva Zona Heaster Shue had been married only a short time when she was found dead at home on 23 January. A local doctor first treated it as a natural death.\n\nHer mother, Mary Jane Heaster, went to prosecuting attorney John A. Preston and demanded another look. On 22 February the body was exhumed. Three physicians — Drs. Knapp, Rupert, and Houston McClung — found the neck broken and the windpipe crushed. The Greenbrier Independent reported it that week. Edward Stribbling “Trout” Shue, a blacksmith, was jailed and indicted for murder.\n\nAt trial in Lewisburg that June, the State used the autopsy and Shue’s conduct around the body. The defense, hoping to make Mary Jane look unstable, asked her about visions. She testified — the Independent printed the questions — that her daughter had come to her four times while she was awake and said her neck had been “squeezed off at the first joint.” The prosecution had not opened with a ghost. The defense put that story on the record.\n\nIn early July 1897 the jury returned first-degree murder after one hour and ten minutes and recommended life in prison. Shue went to the penitentiary at Moundsville and died there on 13 March 1900.",
    "mustKeep": "Victim Elva Zona Heaster Shue, died 23 Jan 1897. Autopsy 22 Feb: broken neck, crushed windpipe. Defendant Edward Stribbling “Trout” Shue. First-degree murder, life sentence (Greenbrier Independent, 8 July 1897; jury out 1 hour 10 minutes). Died 13 Mar 1900 at Moundsville — about three years later, not “eight.” The ghost story entered on defense cross-examination, not as prosecution evidence.",

    "story": "From 1993 into 2009, German police hunted a woman who did not exist. The same female DNA profile turned up at about forty crime scenes — burglaries, thefts, and six killings, including the 25 April 2007 shooting of police officer Michèle Kiesewetter in Heilbronn. Investigators called the unknown woman the Phantom of Heilbronn, or the Woman Without a Face. By January 2009 the reward was 300,000 euros. They released a photofit. It showed a man.\n\nThen the profile appeared where it could not: on papers tied to a dead man. A second test did not find it. In late March 2009, prosecutor Volker Link said the puzzle was solved. The cotton swabs used to lift evidence were sterile — they killed germs — but they were not certified free of human DNA. An unnamed woman who worked at a swab factory in Bavaria had left her own genetic material on unused sticks. Police had been typing the equipment.\n\nThere was no female serial killer linking those forty scenes. Kiesewetter’s murder, and other real crimes in the pile, had to be investigated as themselves. The woman whose DNA started the hunt had committed no crime.",

  {
    "id": "brides-in-the-bath",
    "title": "The Brides in the Bath",
    "country": "England",
    "kind": "true-crime",
    "kindLabel": "True crime",
    "year": "1912–1915",
    "hook": "Three English wives found drowned in rented baths, three inquests that called it accident, and one bigamist hanged in 1915.",
    "story": "In England in the 1910s, three women died in rented bathtubs. Three different inquests called it an accident.\n\nIn July 1912, Beatrice “Bessie” Mundy was found drowned at 80 High Street, Herne Bay. Her husband, using the name Henry Williams, had taken her to a doctor for supposed fits. She had made a will in his favor days before. The inquest said misadventure.\n\nIn December 1913, Alice Burnham died in a bath at 16 Regent Road, Blackpool, after marrying a man who used the name George Smith. Another accidental drowning.\n\nOn 18 December 1914, Margaret Elizabeth Lofty — married the day before under the name John Lloyd — was found dead in a bath at 14 Bismarck Road, Highgate. Another inquest: accident.\n\nAlice’s father, Charles Burnham, saw a newspaper account of the Highgate death and recognized the pattern. Police found one man under the three husbands: George Joseph Smith, a bigamist. He was tried at the Old Bailey from 22 June 1915 for Mundy’s murder. The judge allowed the other two deaths as evidence of a “system.” Pathologist Bernard Spilsbury told the court those tubs were a poor fit for an ordinary epileptic drowning. The jury was out about twenty minutes. Guilty, 1 July 1915. Smith was hanged at Maidstone Prison on 13 August 1915. He was not separately convicted of all three murder counts in that trial.",
    "mustKeep": "Killer George Joseph Smith (aliases Henry Williams, John Lloyd). Bessie Mundy, Herne Bay, July 1912. Alice Burnham, Blackpool, 12 Dec 1913. Margaret Lofty, Highgate, 18 Dec 1914. Tried for Mundy’s murder; other deaths admitted as “system.” Guilty 1 July 1915; hanged 13 Aug 1915, Maidstone. He was not separately convicted of all three murder counts in that trial.",
    "sensitivity": "Do not: drowning play-by-play, invented whispers at the tub, sexualize the three women.",

    "story": "La Tunda is a shapeshifting forest being of Afro-Colombian and Afro-Ecuadorian Pacific-coast lore, especially in Chocó and Esmeraldas. She lures people—often children, or men working in the jungle—by taking the form of a loved one, typically a mother. The disguise is imperfect: one foot is a wooden molinillo, the kitchen whisk used to stir chocolate, and she works to hide that defect. Once a victim follows her into the forest, she feeds them river shrimp and holds them in a dazed state called entundamiento; a person so held is entundado. Rescue traditionally needs godparents, drums, prayer, and sometimes gunshots to frighten her off. Other versions say she appears as a beautiful woman to loggers, then shows a monstrous form and drinks blood or eats the man. Communities still treat her as a visión that polices children who wander and adults who enter the monte after dark. Written records cluster in the twentieth century; Adalberto Ortiz used the figure in La entundada (1971). Some Afro-Ecuadorian scholars read the wooden leg and the flight into the forest as a memory of cimarronas and of punishments inflicted on recaptured runaways.",

    "story": "In Trinidad and Tobago and across the eastern Caribbean, the soucouyant—also soucriant; Ol’ Higue in Guyana and Jamaica; asema in Suriname—is a person, usually a reclusive old woman, who by day looks ordinary. At night she sheds her skin, leaves it in a mortar, and flies as a ball of fire. She enters houses through cracks and keyholes and sucks blood from sleeping people, leaving bruises. If she takes too much, the victim dies or becomes a soucouyant. Some say she trades the blood with Bazil, a demon in the silk-cotton tree, for power. To catch her, scatter rice: she must count every grain. To kill her, find the skin and rub it with coarse salt or pepper so she cannot put it back on before sunrise. She belongs to the wider class of jumbies. Folklorists treat her as African–European syncretism: Yoruba àjé and Akan obayifo night-witches meeting French vampire and loup-garou lore, the related loogaroo. Giselle Liza Anatol’s study of circum-Caribbean female vampires is the standard modern treatment. Variants allow men and younger people; the old-woman form remains the core Trinidadian type.",

    "story": "In medieval Icelandic sagas, a draugr—also haugbúi, mound-dweller, or aptrganga, again-walker—is a corporeal revenant, not a transparent ghost. The dead person, often greedy, unpopular, or found sitting upright, returns in a swollen, death-blue or corpse-pale body that stinks, has superhuman strength, and can swell, shapeshift, ride roofs, drive animals mad, and start a chain of further deaths. Grettis saga, written in the fourteenth century, gives two set pieces: Grettir wrestles Kárr the Old inside his barrow and takes the treasure; later he fights Glámr, a Swedish shepherd killed at Yule who then walks, breaks bones, and, as he dies a second time, curses Grettir with outlawry and a terror of the dark. The saga never actually calls Glámr a draugr, though scholars do. Eyrbyggja saga’s Þórólfr Twist-Foot sits dead on his high-seat, then kills livestock and people until his corpse is moved and walled in. Prevention includes carrying the body out a special corpse-door, pinning the feet, and placing iron scissors on the chest. Destruction is to wrestle the body down, cut off the head, burn it, and scatter the ashes. Later Norwegian folklore splits the word into a land revenant and a sea-draug of the drowned, with a head of seaweed in a half-boat.",
