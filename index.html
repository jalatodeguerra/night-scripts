    "hook": "The Korean ghost of a woman who died unmarried, bound by han, wearing white mourning clothes and loose hair until a soul wedding releases her.",
    "story": "A cheonyeo-gwisin, also songaksi, malmyeong, or sonmalmyeong, is the ghost of a young woman who died unmarried in Korean folk belief. Under Joseon Confucian order, a woman’s life was defined as daughter, wife, and mother. Death before marriage left han — accumulated grief and resentment — that bound the soul to this world. She is defined by that unfinished life-script, not by a single murder plot. She is usually shown in white mourning clothes, sobok, with hair hanging loose, because only married women wore the hair up. Older descriptions can make her neat and almost human. In the classic Janghwa Hongryeon jeon, Hongryeon appears before a governor as “a beautiful woman dressed in a green jacket and a scarlet skirt” who bows; he has to ask if she is human or demon. The horror of a virgin ghost who died with a grudge is also in Seo Yu-young’s Geumgye pildam (1873). Later Korean horror film made the pale, long-haired, floating figure standard. That dripping-hair look is cinema, not the Joseon default.\n\nShe attaches to girls her own age, ruins households, haunts newlyweds, and brings illness. Families may enshrine her in a small wall box or door gap and treat her as a dangerous household spirit. The male counterpart is the chonggak-gwisin or mongdal-gwisin, also called samtae in some ritual speech. The usual remedies are a shamanic exorcism or a soul wedding, yeonghon gyeolhonsik or sahonje, that marries a virgin ghost to a bachelor ghost so both can leave. The Encyclopedia of Korean Culture describes heojaebi-gut: straw or dummy figures of the dead couple are married inside a larger rite for restless souls, especially in Yeongnam and Honam, often for the unmarried drowned. The point of the wedding is not romance. It is to seat the dead as ancestors. Folk practice also placed phallic straw figures in the coffin or erected phallic statues; some remain at Haesindang Park in Samcheok.\n\nThe English label “virgin ghost” comes from that patriarchal life-script. Do not mock soul weddings or living Korean shamanic practice, and do not paste on The Ring as if it were the Korean source. Ringu and its American remake drew on Japanese onryō cinema. Korean film later used the same wet hair. The folk type is older: an unmarried dead woman, han, white clothes or a surprisingly human face, and a wedding or a gut that lets her go.\n\nGwangju and other Korean-English explainers still stress the same social fact: a woman who died before the roles assigned to her could not become a proper ancestor, so the household had to house her or marry her off in death. Modern school-horror and webtoons reuse the white clothes and loose hair for a murdered classmate. That is a new plot laid on an old type. If a script needs the folk cause, use the unmarried death and the han, not a slasher origin.",
    "mustKeep": "She is defined by dying unmarried, not by a single murder plot; han is the binding emotion; sobok and loose hair mark the unmarried dead; older texts can make her look human, the dripping-hair film look is later; male counterpart is chonggak/mongdal-gwisin; release is exorcism or a soul wedding, not a Hollywood slaying.",

    "hook": "A corporeal Icelandic revenant that walks from the mound, swollen and death-blue, and has to be beheaded and burned to die a second time.",
    "story": "In medieval Icelandic sagas, a draugr — also haugbúi, mound-dweller, or aptrganga, again-walker — is a corporeal revenant, not a transparent ghost. The dead person, often greedy, unpopular, or found sitting upright, returns in a swollen, death-blue or corpse-pale body that stinks, has superhuman strength, and can swell, shapeshift, ride roofs, drive animals mad, and start a chain of further deaths. Sitting or standing corpses are a warning that the dead may walk.\n\nGrettis saga, written in the fourteenth century about an eleventh-century outlaw, gives two set pieces. Grettir breaks into the barrow of Kárr the Old, who has haunted an island and driven farmers off. They wrestle among horse-bones until Kárr falls; Grettir cuts off the head and lays it at the thigh, then takes treasure, including a sword. The saga calls Kárr a draugr. Later Grettir fights Glámr, a Swedish shepherd hired to a haunted farm, who refused the Yule fast, was found dead in the snow, could not be moved to church, and then walked, breaking bones and emptying the district. Grettir throws him, and as Glámr dies a second time he curses Grettir with outlawry, failing strength, and a terror of the dark. The saga never actually calls Glámr a draugr — it uses “troll” — though scholars do. Say that on camera.\n\nEyrbyggja saga’s Þórólfr Twist-Foot sits dead on his high-seat, then kills livestock and people. A shepherd is found coal-black with every bone broken near the cairn; birds that land on the grave fall dead. When the corpse is dug up it is unrotten, “blue as hell, and big as a neat.” Fire is slow to take it. Prevention in later Icelandic custom includes carrying the body out a special corpse-door so it cannot find the way home, pinning the feet or tying the toes, and placing open iron scissors on the chest. Destruction in the sagas is to wrestle the body down, cut off the head, burn it, and scatter the ashes.\n\nLater Norwegian folklore splits the word into a land revenant and a sea-draug of the drowned, with a head of seaweed in a half-boat. That is a later split, not the saga type. Video games and “Viking vampire” lists add blood-drinking the sagas do not describe. Keep the medieval Icelandic walking corpse distinct from those.\n\nEyrbyggja also shows a legal remedy for a house full of walkers: a door-doom, a court at the doorway, after which the dead are judged out and the house is purified. That is saga law, not a folk charm you can carry in a pocket. When a script needs a look, use the swollen blue body and the mound or the farm roof. Leave the seaweed head for a sentence that says Norway later split the word. Leave Skyrim’s Draugr in the pop-culture clause.",
    "mustKeep": "Corporeal corpse, not a see-through ghost; death-blue or corpse-pale and swollen; mound-guardian and farm-haunter are both attested; Grettir vs Kárr and vs Glámr are the main saga scenes; Glámr is not named draugr in the text; second death is behead, burn, scatter; Norwegian sea-draug with seaweed head is a later split, not the saga type.",

    "hook": "Two farm workers were convicted of murdering a shepherd who, years later, walked back into the village alive and asked for his baptismal certificate so he could marry.",
    "story": "In August 1910, José María Grimaldos López, a shepherd from Tresjuncos in Spain’s Cuenca province, sold some of his sheep and vanished. The date later fixed in the file was 21 August. He worked on a farm, El Palomar, at Osa de la Vega. His family accused two coworkers — farm overseer León Sánchez Gascón and watchman Gregorio Valero Contreras — of killing him for the money. There was no body.\n\nA first inquiry was closed in 1911 for lack of evidence. In 1913 magistrate Emilio de Isasa, at the Belmonte court, reopened the file and ordered the two men detained. Under violent Civil Guard interrogation they confessed to a murder and to destroying the remains. A death certificate was issued that noted the corpse had never been identified because it had never been found. The interrogations happened; they are not a scene to restage.\n\nIn 1918 a jury at the Audiencia Provincial de Cuenca convicted both men and sentenced them to 18 years. The jury was out about half an hour. Valero was sent to the prison of San Miguel in Valencia; Sánchez to the central prison at Cartagena. They served years of the term and were released in July 1924 under pardons. Their families carried the stigma of a murder that had not been shown by a body.\n\nIn February 1926 the parish priest of Mira, at the other end of the province, wrote to Tresjuncos asking for Grimaldos’s baptismal record: the missing man was alive and wanted to marry. The Tresjuncos priest, Pedro Rufo Martínez Enciso, received the letter. Grimaldos then appeared in person. He was identified. He said he had not known of the case. On 19 February 1926 he was brought before the Belmonte judge for that identification. Photographs of him were taken on 7 March 1926 at the judge’s request.\n\nThe affair was used in the press against the Primo de Rivera dictatorship. The minister of Grace and Justice, Galo Ponte y Escartín, ordered a review. A ministerial note said there were grounds to think the confessions, the essential basis of the convictions, had been obtained by “violencia continua inusitada.” On 10 July 1926 Spain’s Supreme Court voided the 1918 sentence, stating that a crime that had never been committed had been punished, and declared Valero and Sánchez innocent. The death certificate was also nullified. The Court treated the review remedy flexibly: the men were no longer in prison, but the error was still to be corrected.\n\nLater attempts to prosecute officials and Civil Guards involved in the original file ended in acquittals. In 1935 the minister of justice was photographed presenting the two men with a payment. The miscarriage is cited as a reason for later changes in Spanish criminal procedure, including rules about homicide charges without a body that lasted, in one form, until a 2015 reform.\n\nThe events were in Osa de la Vega and Tresjuncos, province of Cuenca — not the city of Cuenca. The name “crimen de Cuenca” was popularized in 1926 newspaper writing, then by Pilar Miró’s 1979 film, which was held back in 1980 and released in 1981. The film is not evidence. Grimaldos’s nickname and jokes about his intelligence are later color. Do not use them. There was no murder. The living man asked for a baptismal certificate so he could marry.",
    "mustKeep": "1) There was no murder and no body. 2) The missing man was José María Grimaldos; the convicted men were León Sánchez and Gregorio Valero. 3) First inquiry closed 1911; case reopened 1913; jury conviction and 18-year sentences in 1918. 4) Grimaldos was found alive in 1926 after a priest in Mira requested his baptismal record for a marriage. 5) Supreme Court annulled the convictions on 10 July 1926. 6) The events were in Osa de la Vega and Tresjuncos, province of Cuenca—not the city of Cuenca.",
    "sensitivity": "Do not dramatize the interrogations. Do not mock Grimaldos’s nickname or intelligence. Do not treat Pilar Miró’s 1979 film as evidence. A child is not involved; keep the focus on the wrongful convictions and the living ‘victim’.",
    "sources": [

    "id": "pyjama-girl",
    "title": "The Pyjama Girl case",
    "country": "Australia — Albury, New South Wales",

    "countryShort": "Australia",

    "year": "1934–1944",
    "hook": "A burned, unidentified woman found in a roadside culvert was kept in a formalin bath and shown to the public for a decade before police named her and her husband was convicted of manslaughter.",
    "story": "On 1 September 1934 the burned body of a young woman, dressed in pyjamas, was found in a culvert beside Howlong Road near Albury, New South Wales, on the New South Wales side of the Victorian border. She could not be identified. The remains were preserved in formalin in a zinc-lined bath at the University of Sydney and, later, at police premises, and shown to hundreds of people who might recognize her. That public display is a fact of the investigation. It is not material to linger on.\n\nAmong those who saw the body, or photographs, was Antonio Agostini, an Italian-born waiter and journalist whose wife, Florence Linda Agostini, born Linda Platt in London, had been reported missing from Melbourne in late August 1934. The couple had been living in Carlton. He worked on the newspaper Il Giornale Italiano; she worked at a hairdressing salon. Agostini later moved to Perth in 1936 and to Sydney in 1938. In 1938 he went to police, did not identify the body as his wife, and gave them the name of Linda’s dentist — the records that first eliminated her. A 1938 inquest still failed to name the dead woman. An inaccurate dental chart, made by a local dentist without forensic experience, had led police to rule Linda out.\n\nIn February 1944 those charting errors were corrected. A new dental comparison, with matching freckles on an arm, led officials to identify the body as Linda’s. Several acquaintances were said to confirm it. On 4 March 1944 Agostini, then a waiter at Romano’s in Sydney, was interviewed by New South Wales police commissioner William John MacKay, who had known him in the 1930s. Agostini said his wife had died of a gunshot during a quarrel in their Carlton home and that he had driven the body across the state border and tried to burn it. He was taken to Melbourne, arrested on 6 March, and committed in April to stand trial for murder.\n\nTried for murder in Melbourne in June 1944 before Justice Charles Lowe, he was convicted of manslaughter and sentenced to six years with hard labour. The jury did not accept murder. Linda was buried on 13 July 1944. Agostini had been interned as an enemy alien during the war and released in February 1944. He was released from the manslaughter sentence in 1948 and deported to Italy, where he died in 1969.\n\nLater writers, including historian Richard Evans in The Pyjama Girl Mystery (2004), have argued that the 1944 identification was forced, that physical discrepancies remained, and that another missing woman, Anna Philomena Morgan, had also been a candidate. Dr Thomas Benbow contested the identification at the time. Do not present that dispute as settled, and do not present Antonio’s “accident” claim as proven fact. The official identification was Linda Agostini. The jury’s finding was manslaughter.\n\nTourism and true-crime extras treat the formalin bath as a sideshow and the 1944 file as a clean close. The documented case is a body found near Albury on 1 September 1934, ten years without an official name, a first dental chart that closed a door, a second that opened it, a husband’s statement, a manslaughter verdict, a burial on 13 July 1944, and a live argument about whether the name on the file is the right one.",
    "mustKeep": "1) Body found 1 September 1934 near Albury, not in Sydney. 2) She remained officially unidentified for about ten years; the body was preserved in formalin and shown to the public. 3) Official 1944 identification was as Linda Agostini, after a corrected dental chart. 4) Antonio Agostini said the shooting was in Melbourne and the dumping near Albury. 5) He was convicted of manslaughter, not murder, and sentenced to six years. 6) He was deported to Italy in 1948; Linda was buried 13 July 1944.",
    "sensitivity": "Do not describe burning or injuries. Do not treat the preserved body as spectacle. Later writers have questioned the identification; do not present that dispute as settled, and do not present Antonio’s ‘accident’ claim as proven fact—the jury’s finding was manslaughter.",

    "hook": "A Paris bailiff vanished; weeks later a body and a smashed trunk turned up near Lyon, and a forensic re-examination identified him after the first doctors had said it was someone else.",
    "story": "In late July 1889, Paris bailiff Toussaint-Augustin Gouffé disappeared. He was forty-nine, a widower with two daughters, and kept an office at 148 rue Montmartre. He was last seen on 26 July. When he did not come home, his housekeeper alerted his brother-in-law, Louis-Marie Landry, who reported him missing.\n\nIn mid-August a badly decomposed man’s body was found in woods near Millery, south of Lyon. A road mender followed a smell on 13 August. Pieces of a wooden trunk shipped from Paris were recovered nearby, at Saint-Genis-Laval. A key fitted the lock; a missing nail matched a nail found at Millery. A railway tag and the PLM company’s registers later tied the trunk to a Paris-to-Lyon shipment on 27 July 1889. Forensic surgeon Paul Bernard autopsied the body on 14 August and could not identify it. Washed hair later showed the first colour reading had been wrong: dirt and decomposition had made chestnut hair look black. Landry, sent from Paris, also failed to identify the remains. The body was buried.\n\nMarie-François Goron of the Paris Sûreté kept the Millery body in mind as Gouffé. He had the corpse exhumed. In November 1889, beginning 13 November, Lyon forensic physician Alexandre Lacassagne spent a week on a second examination. He compared the skeleton with Gouffé’s military and dental records and his family’s description: height about 5 feet 8 inches, age about fifty, a missing upper right molar, a deformity of the right knee and heel consistent with a limp, and hair matched to Gouffé’s brush. Lacassagne concluded the body was Gouffé’s.\n\nInquiry showed Gouffé had been seen with indebted swindler Michel Eyraud and Eyraud’s companion Gabrielle Bompard, who had left Paris about 27 July. Goron published pictures of a replica trunk. Witnesses placed the pair with the chest. A London carpenter later said he had sold them the trunk. Bompard surrendered in Paris in January 1890. Eyraud was arrested in Havana in May 1890 and extradited.\n\nAt their December 1890 trial they blamed each other. Bompard’s lawyers argued she had acted under hypnosis — a fashionable, contested defence, not a finding of fact. Both were convicted. Eyraud was guillotined in Paris on 3 February 1891. Bompard received 20 years’ hard labour.\n\nLater retellings restage the apartment, invent dialogue, and treat mesmerism as proved. They also sexualize Bompard and Gouffé. The court had a body that the first doctors said was not Gouffé, a second examination that said it was, two accused who pointed at each other, and a hypnosis argument the jury was not required to believe. Lacassagne’s identification — bones, teeth, a limp, and a hairbrush — is the part of the file that changed forensic practice and later earned him the classroom nickname “French Sherlock Holmes.” The rest is a missing bailiff, a trunk on the Lyon line, and two convictions.",
    "mustKeep": "1) Victim was Toussaint-Augustin Gouffé, a Paris bailiff. 2) The body was found near Millery, not in Paris. 3) Lacassagne’s November 1889 examination is what identified him after an earlier failure. 4) Killers were Michel Eyraud and Gabrielle Bompard; both convicted. 5) Only Eyraud was executed, on 3 February 1891; Bompard got 20 years. 6) The hypnosis claim was a defence argument, not proven.",

    "story": "On 27 April 1959, Indian Navy commander Kawas Manekshaw Nanavati shot businessman Prem Ahuja dead in Ahuja’s Bombay flat, then went to the police and admitted the shooting. Nanavati was second-in-command of INS Mysore, which had come into Bombay that March. His wife, Sylvia, had that day told him of her affair with Ahuja. He collected a revolver and ammunition from his ship on a false pretext. He remained in naval custody through the trial.\n\nHe was tried for murder under section 302 before a special jury in Greater Bombay. The Crown said Ahuja had been shot after coming from a bath. The defence said the gun went off in a scuffle. Crowds packed the streets around the court. Nanavati arrived in dress uniform. On 23 September 1959 the jury found him not guilty, 8–1, and gave no reasons. The sessions judge disagreed, called the verdict one no reasonable jury could reach on the evidence, and referred the case to the Bombay High Court under the procedure then in force when a judge and jury parted.\n\nOn 11 March 1960 that court convicted him of murder and imposed life imprisonment. The same day the governor of Bombay suspended the sentence pending an intended Supreme Court appeal, on condition that Nanavati remain in naval custody. A warrant could not be served. The Supreme Court of India later held that the governor had overreached. Nanavati was transferred to civilian prison in September 1960. On 24 November 1961 the Supreme Court upheld the murder conviction.\n\nHe was granted parole on health grounds in October 1963 and allowed to stay at Lonavala. On 16 March 1964 he received a pardon from Maharashtra governor Vijaya Lakshmi Pandit, on a mercy petition and “in view of the circumstances of the case.” A written assent from Ahuja’s sister, Mamie, was part of the pardon file. The pardon was not a personal order from Jawaharlal Nehru, though Pandit was Nehru’s sister. He and his family later emigrated to Canada, in 1968. He died there in 2003.\n\nThe case was a tabloid event. Blitz and street crowds treated it as a drama of honour. Later films, including Rustom, are fiction. A common line says this was India’s last jury trial and that the verdict abolished juries. Legal historians, including in the Economic and Political Weekly, have shown that jury trials continued in India after 1959 and that there was no single surviving act that killed them overnight. Do not call it, without qualification, India’s last jury trial.\n\nDo not invent the words of the confrontation in the flat. Do not sexualize Sylvia Nanavati or Ahuja. Do not use communal stereotypes that the 1959 defence and tabloids used. The documented sequence is a shooting, a surrender, an 8–1 acquittal, a High Court conviction, a Supreme Court affirmance, and a governor’s pardon in 1964.",

    "story": "On 20 March 1927, Albert Snyder, an art editor at Motor Boating magazine, was killed in his home in Queens Village, New York, near Jamaica. His wife, Ruth Snyder, told police that intruders had knocked her unconscious, bound her, murdered her husband, and stolen jewelry. Officers doubted the account. She showed no injury consistent with a blow. Items she said were stolen were found in the house, in some reports under a mattress.\n\nShe named Henry Judd Gray, a married corset salesman with whom she was having an affair, and said he had done the killing. Gray had arranged a false hotel alibi in Syracuse; a friend had taken a room in his name. Police found him there. He also confessed and said they had planned the murder together. Each confession, if believed, implicated the person who made it. Investigators established that Ruth had obtained life-insurance cover on Albert that paid extra if he died by accident or violence. An insurance agent later lost his job and was imprisoned for forgery in connection with the paperwork. Period figures for the policies vary in later summaries; the extra, violence-triggered cover is the part that belongs in the file.\n\nThey were tried jointly in Queens in the spring of 1927. Each blamed the other. Ruth’s cross-examination was reported at length in the New York Times. The New York Court of Appeals later recited the basic sequence: a killing in the bed, a bound wife, a Syracuse alibi that did not hold, and additional proof that a crime had been committed. The New York tabloids — the Daily News, Daily Mirror, and Daily Graphic — turned the case into a year-long contest. Damon Runyon called it the “Dumbbell Murder.” About 1,500 people packed the courtroom each day; more stood in the street. Hawkers sold fake tickets. The coverage invented texture and slurs. Those slurs are not facts. These were not public officials or celebrities. They were ordinary people whose file sold papers.\n\nBoth were convicted of first-degree murder. After appeals failed, they were executed at Sing Sing on 12 January 1928, Ruth first, then Gray. Ruth was the first woman executed at Sing Sing since Martha Place in 1899.\n\nJames M. Cain later reworked the insurance-murder, stripped of tabloid invention, as Double Indemnity. That literary afterlife is real. The illicit photograph of the execution, and the Daily News front page that used it, are also real. Do not describe the photograph. Do not use it.\n\nLater extras include Gray’s hypnotic-seduction quotes to the Daily News, a count of prior failed attempts as if each were proved, and “femme fatale” labels. Those are tabloid products. The documented case is a staged burglary that collapsed, extra insurance, two confessions that pointed at each other, two first-degree verdicts, and two executions on the same day.",

    "story": "In mid-September 1935, Isabella Ruxton (née Kerr) and the household’s young adult maid, Mary Jane Rogerson, born 1915, disappeared from the Lancaster home of Dr Buck Ruxton. Ruxton was an Indian-born general practitioner, born Bukhtyar Rustomji Ratanji Hakim, who practised in Lancaster under the anglicised name. He offered shifting explanations. He reported the women missing at different times as police on both sides of the border began to compare notes.\n\nOn 29 September a visitor looking over a bridge north of Moffat, Dumfriesshire, saw bundled human remains in the ravine of Gardenholme Linn. Local sergeant Robert Sloan was first on the scene. He secured it and kept the wrappings. Some parcels were wrapped in a limited-circulation newspaper. Once dried, the paper helped fix date and place of sale. Investigators first thought the remains were a man and a woman. That reading changed as the pieces were assigned.\n\nA team led by Professor John Glaister of Glasgow, with anatomist James Couper Brash of Edinburgh and others, identified the two women. They took fingerprints from damaged tissue, fitted feet to shoes, and used a then-novel photographic superimposition of a studio portrait onto a skull — later called the Glaister–Brash method. Detective Constable Kenneth Stobie of Edinburgh City Police did the photographic work. The original negative of a Lancaster studio portrait of Isabella was obtained. Insect evidence, the life cycle of blowflies, helped show how long the remains had lain there. The manner of disposal pointed to someone with anatomical training. At the house in Lancaster, police found bloodstains and signs of a cleanup. A palm print from a bathroom door was matched to Rogerson. Ruxton was arrested in October 1935.\n\nHe was tried at Manchester Assizes in March 1936 for Isabella’s murder. Evidence about Rogerson was admitted. The trial lasted about eleven days and was built almost wholly on circumstantial and specialist evidence. The jury convicted him in about an hour. He was hanged in Manchester on 12 May 1936. Crowds gathered outside the prison that day.\n\nThe investigation is widely cited as a turning point for coordinated forensic work in British policing: fingerprints, entomology, newspaper circulation, and skull-to-photograph overlay in one file. Glaister and Brash published Medico-Legal Aspects of the Ruxton Case in 1937.\n\nLater extras to strip: the nickname “Savage Surgeon”; period gossip that Isabella “had it coming”; a reconstructed jealousy scene as if it were proved in the indictment; and any use of the couple’s children as colour. A 2023 museum account repeats a late-night jealousy story. That is a later telling, not a courtroom special verdict on motive. Do not describe the injuries or the cutting. The case that stands is two missing women, remains in a Scottish ravine on 29 September 1935, a forensic identification, and a murder conviction in Manchester.",

    "year": "Iberian medieval roots; Brazilian colonial era (16th c. onward); term widely recorded mid-20th c.",
    "hook": "A woman cursed for a sexual sin—most often an affair with a priest—is forced to become a headless, fire-breathing mule that gallops seven parishes by night.",
    "story": "The mula sem cabeça is not a free-roaming demon. In Brazilian folk belief she is a living woman under a curse, condemned to leave her human body on certain nights and run the countryside as a mule whose head has been replaced by fire. The punishment is moral and Catholic in structure. The most common version says the woman had a sexual relationship with a priest; a second, also old, says she slept with a lover before marriage. In both tellings the Church’s control of female sexuality is the engine of the tale. Folklorist Luís da Câmara Cascudo treated the figure as a core entry in the Brazilian imaginary, and later compilers note that the story is Iberian in origin—brought by Portuguese and Spanish settlers—and then rooted in rural Brazil, especially the sugar zone of the Northeast and the interior of the Southeast.\n\nShe is usually brown or black. Steel or silver horseshoes make a trot louder than any ordinary horse. Despite having no head she neighs, and some witnesses say she also sobs like a woman. A bridle is tied to the place where a mouth should be. Fire issues from the missing nostrils or from the stump of the neck; some versions give her a placeholder head and mane made of the same fire, with a red-hot iron bit. She smells of sulfur. Transformation is said to happen at a crossroads, most often on Thursday night into Friday. The curse lasts until the third crow of the cock, when she returns to human form exhausted, naked, sweating, and often injured. She is then condemned to cover the territory of seven parishes in a single night, beginning and ending at the parish where the sin was committed—the same seven-parish circuit attached, in Brazilian lore, to the werewolf.\n\nThe curse is not contagious. It is the result of a willful sin, so it cannot be passed by bite or blood. A person who meets her on the road must not cross her path; if he does, she will follow and trample him. The safer folk instruction is to lie face down, covering teeth, nails, and anything that shines, because the mule’s sight is poor and she may pass without noticing. Those who want to break the spell rather than hide have a short list of remedies. Drawing even a drop of her blood with a needle or other sharp point stops the transformation for as long as the benefactor lives in that parish. Tying her to a cross holds her in human form only until dawn. Removing the iron bridle is the more stable cure: she will not change again while the person who took the bridle lives. Putting the bridle back on her mouth restores the curse. In some tellings the priest-lover himself can lift the spell by cursing her seven times before saying Mass. When the curse breaks, the grateful woman is expected to repent and often to marry her rescuer.\n\nRegional variants should be flagged, not collapsed. In Argentina and Paraguay the related figure is the almamula, mula ánima, or mula frailera; in parts of Mexico a similar headless mule is called malora. Hispanic South America also has the muladona. A much rarer Brazilian variant puts the curse on the priest instead: his headless ghost rides a normal horse. Collectors treat that version as thin and possibly contaminated by the imported Headless Horseman.\n\nWhat later culture added is easy to separate from the folk story. Monteiro Lobato put the mule into children’s literature (Histórias de Tia Anastácia, Sítio do Pica-pau Amarelo), and television and games later gave her a cartoon fire-head. Netflix’s Invisible City (season 2) invents a named woman, Clarisse, and a domestic plot around the curse. None of that is the rural legend. The folk mule has no personal name, no redemption arc, and no personality beyond the punishment: a woman reduced to a sterile work animal, running until the cock crows.",

    "id": "pishtaco",
    "title": "Pishtaco (Ñaqaq / Kharisiri)",
    "country": "Peru (Andean highlands; also Bolivia under the names ñakaq and kharisiri)",
    "continent": "South America",
    "countryShort": "Peru",

    "year": "Attested 1570s (Cristóbal de Molina); living belief through the 20th–21st c.",
    "hook": "A powerful outsider—usually a white or mestizo man—kills or sickens Indigenous Andeans in order to steal the fat from their bodies and sell it.",
    "story": "The pishtaco is not a ghost. In Andean lore he is a human or human-shaped attacker, almost always an outsider with power, who extracts the body fat (unto, cebo) of Indigenous people. In central and northern Peru the Quechua name is pishtaco or pishtaku, from pishtay, to cut in pieces or cut the throat. South of the Andes he is the ñakaq or naq’aq, the butcher. Among Aymara speakers of the Bolivian Altiplano he is the kharisiri or lik’ichiri, the fat-maker or fat-remover. The names change; the structure does not: a stranger with a knife, or with a sleep-powder, takes the fat that Andean physiology treats as the seat of strength, and the victim wastes and dies.\n\nThe earliest written account is from the 1570s. The priest Cristóbal de Molina, writing about the Taki Onqoy movement, recorded that Andeans believed the Spanish had been sent to collect Indian fat as the only cure for a disease. Antonio de Herrera later repeated the rumor. The belief had a material hook. Conquistadors did use enemy corpse fat as a wound salve—a European medical practice that lasted into the nineteenth century—and later lore said Spaniards boiled bodies to grease muskets and cannon that rusted in Amazon humidity. In the early eighteenth century the figure attached to Bethlehemite friars who opened a hospital in Cuzco, begged alms on the roads, and wore brown habits. From then on the pishtaco’s clothes track whoever holds power: a priest with a long knife; a hacendado on horseback in boots, leather jacket, and felt hat; a man in a car; an engineer; a gringo doctor.\n\nHow he hunts depends on the region. In many Peruvian tellings he waylays a solitary traveler at night, beheads or dismembers the body, and takes the fat at once. In Bolivian kharisiri accounts he may sit beside a sleeper on a bus or on a mountain path, put the person into a deep sleep with prayers or powdered human bone, and cut the hard brown fat from around the kidneys or through the anus, leaving no obvious wound. The victim wakes weak, sickens, and dies in a few days. The fat’s supposed use updates with the economy: colonial wound ointment; later, church bells that ring more sweetly if the victim had a good voice, holy oil, candles, polish for saints’ faces; then soap, medicine, cosmetics; then grease for sugar-mill machinery, road equipment, jet engines, even U.S. rockets. In the 1960s, rumors that the U.S. Air Force needed child fat to start jets led some parents to keep children out of USAID lunch programs. During the economic crisis of the 1980s, ñakaqs with government papers were said to be harvesting fat to pay Peru’s foreign debt.\n\nProtections are specific. Brilliant red-and-black wayruru beans are made into amulets against the kharisiri. Once fat has been taken, the only folk cure—apart from killing the attacker—is to buy human fat and burn it with wayruru beans and a white egg, to restore what was stolen. Anthropologist Juan Antonio Manya recorded chewing chancaca, eating earth, or showing a clove of garlic pierced by a needle. Targets are usually adults, not children or the elderly. A related 1980s scare, the sacaojos or “eye-snatchers,” flipped that rule: gringo doctors were said to harvest children’s eyes in shantytowns; tourists were nearly lynched in 1988. That is a sibling rumor, not the older pishtaco.\n\nWhat is not the folk story: the television series Supernatural gave pishtacos a lamprey mouth and a weight-loss clinic; Gail Carriger’s novels made them a dying vampire species with a single columnar tooth; Tomb Raider and Call of Cthulhu folded them into adventure plots. Those are inventions. The Andean figure is a butcher and a fat thief, not a fanged immortal. He is also not a metaphor that can be sanded smooth. Ethnographers including Anthony Oliver-Smith, Mary Weismantel, and Andrew Canessa have been taken for ñakaqs themselves. The 2009 “pishtacos affair,” in which Peruvian police claimed a gang had sold human fat to European cosmetic labs, was quickly debunked, but the fact that a police general could announce it shows how current the belief remained.",

    "id": "krasue",
    "title": "Krasue (กระสือ / Phi Krasue)",
    "country": "Thailand (with close Cambodian Ahp, Lao Kasu, and other Southeast Asian cognates)",
    "continent": "Asia",

    "year": "Premodern Southeast Asian folk belief; systematically described by Phraya Anuman Rajadhon, mid-20th c.",
    "hook": "By day a sleepy-looking woman; by night her head detaches, trailing guts, and floats out to eat blood, afterbirth, and filth.",
    "story": "The krasue is a nocturnal female spirit of Thai and neighboring mainland Southeast Asian folklore. What villagers see, if they see anything, is often only a glow: Phraya Anuman Rajadhon, the mid-century Thai ethnographer, wrote that a glimmer in pitch darkness is the phi krasue itself, and that Thai even names the glow-worm nawn krasue. When the form is described, it is a woman’s head—usually young and beautiful in later tellings, a hag in Anuman’s older account—with heart, stomach, and a length of intestine hanging from the neck. The viscera advertise hunger. She has no lower body in this state. She hovers. She hunts at night and must rejoin a hidden, headless body before dawn or die in pain.\n\nFolk origins are several, and they should be kept separate. The oldest moral version says a woman who sinned in a previous life—fraud, abortion, killing—is reborn as a phut that must live off waste, raw, or rotten food. Another says a woman learning black magic used the wrong spell and her head separated from her body. Another says she ate food or drink contaminated with a krasue’s saliva or flesh. Popular belief also restricts the condition to the female line of a mae mot or yai mot, a village witch: daughters and granddaughters are watched. In Cambodia the related ahp is often a witch whose magic backfired, or a woman who lent her body to a demon at night; the curse can be passed to another woman, sometimes by bodily fluid, so the first can re-enter the cycle of rebirth. What is not folk, and must be flagged, is the Khmer-princess origin popularized by the 2002 film Tamnan Krasue (Demonic Beauty): a captured princess burned at the stake, a delayed protective spell that saves only her head and organs. Benjamin Baumann has shown that this is a cinematic invention that relocates the ghost in Angkorian Khmer magic for Thai nationalist entertainment.\n\nBy day the host looks ordinary, only sleepy, and avoids close contact. At night the head leaves. She smells blood. She goes to cattle, chickens, and water buffalo, drinking blood and eating organs; she will also take carrion. If blood is scarce she eats feces. Clothes left on the line overnight are found soiled, as if she had wiped her mouth. Anuman’s account is more intimate and worse: around a birth she slips into the room, enters the newborn, eats the entrails, then moves into the mother, who wastes, loses appetite for cooked food, and craves the raw and fishy until she dies. Relatives therefore hide or bury the placenta deep, keep the lying-in room clean, and ring the house with thorns.\n\nThorns are the main architecture of protection. Spiky bamboo fences are built because she fears her intestines will snag and she will be trapped until daylight. Fire and dogs also drive her off. Destroying or hiding the headless body kills her; if she rejoins the wrong body she suffers until death. Cutting the intestines is fatal. Villagers with torches and machetes may follow the glow home and burn what they find. A minority belief says the “true” krasue is only a green light: catch it under a chicken coop and you can bargain gold for its release.\n\nRegional cognates are real but not identical. Lao kasu, Khmer ahp, Malay penanggalan, Balinese leyak, and Vietnamese ma lai all share a detached female head with viscera. The Philippine manananggal, already in this archive, is a different cut: the whole upper torso separates, not the head alone. Do not collapse them.\n\nPop culture added fangs in yakkha style, laser-spitting heads in a Hong Kong film, soap-opera romance, the 2019 film Inhuman Kiss, a Dead by Daylight killer who infects with tentacle-guts, and a long list of erotic krasue pictures. Folk krasue is a filth-eater and a birth-thief, not a tragic lover. Sightings of floating lights over Thai rice fields continue into the 2010s and 2020s; investigators usually find lanterns, methane talk, or cameras, but the classification villagers use remains krasue.",

    "story": "Strigoi, in Romanian folk belief, are not the tuxedoed undead of later fiction. The word is related to Latin strix/striga, the ill-omened night bird, and to Romanian a striga, to scream; cognates include Italian strega and Albanian shtriga. Dimitrie Cantemir, describing Moldavia in 1714–16, treated striga as a witch or warlock belief, tested by dunking, not yet as a blood-drinking corpse. By the nineteenth century collectors had a fuller system. Tudor Pamfile’s compilation of names—strâgoi, moroi, vidmă, vârcolac, cel-rău—shows a cluster, not a single monster. The useful folk split is between the strigoi viu, a living person, and the strigoi mort, a dead one. The living form is a sorcerer marked from birth: seventh child of the same sex, born with a caul, or carrying other signs. He or she may be bald on the crown, refuse garlic and onion, avoid incense, sleep outdoors near St. Andrew’s Day (30 November), and have a spine elongated into a hairy tail. The living strigoi is said to leave the body at night, steal the manna of wheat and the milk of cows, stop rain, bring hail, and drain the strength of neighbors. The dead form is worse. It rises from the grave and returns first to its own family, tormenting them until they sicken and die in turn. It can become invisible, take animal shape, and take vitality from blood.\n\nHow a person becomes one is a list, not a single origin. Die unmarried. Die by suicide. Die under a witch’s curse. Be executed for perjury. Lead a life of sin. Be the seventh same-sex child. Red hair made French geographer Élisée Reclus, writing in 1887, note a special fear: the red-haired dead might come back as dog, frog, flea, or bedbug to suck the blood of girls, so the coffin was nailed hard or a stake was driven through the chest. Wilhelm Schmidt in 1865 described nocturnal attacks on infants and a birth charm: throw a stone behind you and say, “This into the mouth of the strigoi.”\n\nIdentification and disposal were communal and physical. A common test: at midday, a seven-year-old boy in white, of “purity,” is set on a white horse in the graveyard; the horse stops at the guilty grave. Priests read over the corpse. An oak or yew stake, or a nail or knife, is driven into the heart to pin the body to the coffin. Simion Florea Marian, in Înmormântarea la români (1892), describes exhumation, beheading, and reburial of corpse and head face-down. Pig meat killed on St. Ignatius’s day (17 October) was eaten as a guard. Garlic, including braids hung in a house, is the domestic remedy; after the 1989 revolution, activist Gelu Voican Voiculescu was said to have carpeted his apartment with garlic against the improperly buried Nicolae Ceaușescu.\n\nThe belief did not end with folklore books. In 1969 at Căpățâneni, after an old man’s death, relatives died in suspicious circumstances; the unearthed corpse was unrotted, red-faced, eyes open, and was burned. In February 2004 at Marotinu de Sus, Dolj County, relatives of Petre Toma, dead the previous December, dug him up, cut out the heart, burned the body, and mixed the ashes in water for his niece to drink. Six people were convicted of disturbing the peace of the dead. Nearby villages then drove fire-hardened stakes through the dead as prevention.\n\nWhat later culture added is the collapse of this system into Dracula. Bram Stoker’s novel, and the industry after it, took a Transylvanian aristocrat, nightly blood-drinking, and a foreign hunter’s kit, and sold it as “the” Romanian vampire. Folk strigoi are villagers and kin, not counts. They steal harvest and weather as much as blood. The Istrian case of Jure Grando (d. 1656), sometimes cited as the first named “vampire,” is a related štrigon from what is now Croatia, recorded by Valvasor; it is a neighbor, not the Romanian core. Do not import Stoker’s rules—no invitation, no sunlight-as-instant-death, no castle—into a strigoi telling.",

    "story": "The Haitian lougawou is not a European werewolf, and it is not simply the Trinidadian soucouyant under a French name. The word comes from French loup-garou, but in Haiti the creature is a person, almost always a woman, who leaves her human skin and flies to drink the blood of young children. Alfred Métraux, working in the Marbial valley near Jacmel from 1948 to 1950, found that peasants feared loups-garous—also called mové-zè and susèt, “suckers”—more than the zòbòp sorcerers’ societies. In Marbial he recorded no male example. Catholics, Protestants, and Vodou practitioners shared the fear. Accused women were sometimes denounced to rural police, but they were not usually driven out; they remained neighbors under a permanent stain.\n\nHow a woman becomes one is, in the Marbial record, almost never a free contract at the start. The power is often hereditary, mother to daughter, or contagious: wearing a garment or jewel that belonged to a lougawou relative can pass it. Certain lwa, especially Ogou, may inflict the gift as punishment on women who neglect the sacrifices they owe. It can also be the dark side of an “engagement,” a deal with a boko who gives a drugged ring or charm that brings luck and, with it, the hunger. Novices first experience the night flights and cannibal meals as nightmares. Only later does the truth become conscious, and by then the taste for human flesh is, in the telling, a passion they cannot stop. Other lougawou recruit: they ambush women walking alone at night and force or trick them into the sabbat. A few novices attach themselves to older women to learn.\n\nThe transformation Métraux recorded is precise. Before leaving, the woman raises as many fingers as the hours she will be gone. She lights a candle cut with three notches and must be home before the flame reaches the last notch, or she will have an accident. She rubs neck, wrists, and ankles with an infusion of magical herbs and peels off her skin, hiding it in a jar. If someone finds the skin and burns it, or—worse—rubs it with hot pepper, she cannot get back in and dies in agony. Raw, she beats her arms and legs to prepare for flight. Flames come from her armpits and groin; turkey wings sprout on her back. She rises through the thatch. Corrugated iron roofs stop her, not because the metal is strong, but because the nails that hold the sheets to the beams are believed to “stop” witches. Peasants told Métraux they had seen luminous trails in the night sky; comet tails were read as the same light. She does not eat children whole. She saps them. The child weakens and dies, and the neighborhood names the woman who “ate” it.\n\nProtection is practical and religious. An iron cross set in front of the house, offerings to neglected lwa, and refusal of food or objects from a suspected woman are the everyday counters. Children are taught never to accept anything from just anyone. Thatched roofs are more dangerous than nailed tin. Finding and peppering the discarded skin is the lethal counter-magic. Métraux also recorded the social wreckage: a woman he calls Câlina, accused after she gave bread to a sick child who later died, paid for the coffin to quiet the father and was then treated as if she had confessed. The parish sacristan made her swear on a Bible. Neighbors still avoided her when she was ill.\n\nFlag the overlap, then keep the Haitian form. Across the French Caribbean a skin-shedding, blood-taking, sometimes fiery night-woman is a shared type; in Trinidad and the Lesser Antilles she is the soucouyant, already in this archive as a Trinidadian fireball that enters by the keyhole. Haitian ethnography stresses animal or bird transformation (turkey wings, sometimes cats, snakes, birds), the notched candle, the herb-rubbed skin, Vodou causation, and child-blood, not the soucouyant’s ball-of-fire-through-the-crack picture. Dominican lugarú/galipote, which can become a tree or stone and is said to be bulletproof, is another island variant. Hollywood werewolves, full-moon triggers, and male wolf-men are not this story. Neither is a generic “Voodoo curse” plot. The lougawou is a neighbor.",

    "story": "Aisha Qandisha is not a ghost and not a generic succubus. In Moroccan folk belief she is a named jinniya—one of a small set of spirits with personal names and tempers—who lives at water and takes men. Nearly every local account ties her home to a nearby body of water: the sea at Tangier, the Martil at Tétouan, a drainage canal in Fez, the Sebou among the Beni Ahsen. In the south, including Doukkala, she is often called Kharaja instead. She appears as a beautiful young woman, sometimes in a dark cloak over revealing clothes, and the tell is always below: the legs of a goat or a camel. She may pose as a man’s wife. Those who follow her voice or her body are maddened, made impotent, or killed. Pregnant women who see her are said, in some Buffi Sufi accounts, to miscarry. People she possesses may bray or bark.\n\nVincent Crapanzano’s ethnography of the Hamadsha and his 1980 portrait of Tuhami, a tilemaker who believed himself married to a camel-footed she-demon, remain the thickest modern record. Possession by Aisha is described as sexual dysfunction, trance, melancholia, sudden behavior change, and animal mimicry. She is not only an attacker. Hamadsha and related brotherhoods, and some zār-type rites, seek her voluntarily. She can grant favor if appeased with offerings, animal sacrifice, and pilgrimage. Tuhami’s life was organized around trying, and failing, to get free of a marriage he also needed. Lalla Aisha has no tomb; her baraka is said to roam and to answer visitors anyway.\n\nOrigins should be stacked, not chosen as one true story. Edvard Westermarck, after years in Morocco, argued in Ritual and Belief in Morocco (1926) that her name was “of Eastern origin,” linking Qandisha to the Canaanite Qetesh and Astarte and her male associate Hammu Qayyu to Punic Hammon. That genealogy is now treated as obsolete: Qetesh as “sacred harlot” is not supported, and a clean line from Astarte cannot be shown. The Encyclopaedia of Islam derives Qandisha from Hebrew qedēshā, “consecrated woman.” Another etymology hears Arabic Qirtajia, “Carthaginian.” A later popular etiology, common in Moroccan magazines and oral retellings, makes her a historical sixteenth-century woman from the El Jadida / Souss region who lured Portuguese soldiers so Moroccan fighters could kill them, nicknamed “la Condessa,” later Kandicha. Scholars such as Samira Douider treat the Kahina and Aïcha Kandicha pair as Maghrebi female myths that slide between resistance heroine and demon. The ethnographic core does not depend on the countess story. What is stable is a water jinniya with hooves, a hunger for men, and a ritual life in popular Islam and trance brotherhoods.\n\nLocalized rules matter. Among the Beni Ahsen she fears steel knives and needles and has a husband or male partner, Hammu Qayyu. Steel, needles, and the ordinary Muslim apotropaics—Qur’an, iron, staying off lonely water at night—are the folk protections. Recognizing the hooves in time is itself a protection: men who see the feet can still run. Those who give in to the voice do not come home. In Buffi classification she is only one of several Aishas (Aisha of the Sudan, Aisha of the Sea, “Spicy Aisha”); elsewhere those names collapse into her.\n\nWhat later culture added: Gnawa and popular songs to Lalla Aicha that soften her into a lady of blessing; the 2021 French-Moroccan slasher Kandisha, which borrows Candyman structure; tourist “myth or reality” articles that freeze her as a single Portuguese-war heroine. None of that replaces Westermarck’s water-and-hooves figure or Crapanzano’s possessed men. She is not Aisha, wife of the Prophet, and using that confusion is a mistake. She is not a mermaid, though water is mandatory. She is not a ghost of a drowned woman. She is a named jinn who hunts at the edge of irrigation ditches, river mouths, and the sea.",

    "story": "Windigo is not a generic North American monster and not a deer-skulled cryptid. It belongs to the spiritual traditions of Algonquian-speaking peoples around the boreal forests and subarctic of what is now Canada and the northern United States. Spellings and names shift with language: Ojibwe wiindigoo, Cree wīhtikōw, and many others; related figures include the Mi’kmaq chenoo and the Abenaki kee-wakw. The Canadian Encyclopedia’s standard English form is windigo. In most oral traditions it is a malevolent, cannibalistic being tied to the north, winter, cold, famine, and starvation. A human becomes one when greed or weakness corrupts the spirit, when hunger and isolation go too far, or when a prowling windigo spirit possesses a person in a moment of failure. The figure is a warning about what happens when someone is cut out of the community, or cuts themselves out.\n\nAppearance is not one picture. Some tellings give an exceptionally thin body, skull and bones under ash-colored, mummy-like skin. Others give a giant who grows in proportion to every meal and so can never be full—gluttonous and starving at once. Some give pointed or animal ears, antlers or horns, sunken or coal-glowing eyes, sharp teeth, and a stench. Anishinaabe tellings collected by Native Languages of the Americas describe a huge ice-coated man-eater with the human it once was still frozen inside where the heart should be; that inner human must be killed to stop the monster, and only rarely can be rescued. Powers commonly include superhuman strength and stamina, extreme senses, speed like wind, and the ability to walk on deep snow or open water without sinking. It preys on the weak and the socially disconnected. It may kill a lonely traveler, wear that person’s manner for a time, then kill again. It can infect a healthy person or a whole camp with its hunger.\n\nThe first European writing is Jesuit. In 1636 Paul Le Jeune, living among the Algonquin in what is now Quebec, reported a woman speaking of a being that had eaten Attikamek people and of an atchen that would come to devour even the French at the fort. Hudson’s Bay Company men later wrote of spiritual leaders accused of being windigos; in some cases relatives killed the accused as a precaution. The Cree leader Abishabis, after becoming greedy and killing a family, was killed by three men who believed he had become one. Early twentieth-century missionaries coined “windigo psychosis” for patients who feared they would eat people; whether that is a real clinical entity is still disputed and should not be used as the folk story.\n\nHow it is stopped depends on the telling. Some say a club or a gun is enough. Others say the creature must be subdued, the icy heart cut out, and the heart melted in a fire. Others say only a knowledgeable spiritual leader can do it, with a specific ceremony. Ojibwe communities performed wiindigookaanzhimowin, a windigo dance and ceremony, in times of famine; the last known performance in the United States was on the Leech Lake Reservation. The point of the older stories is rarely a monster hunt. It is the obligation to share food and not leave people alone in winter.\n\nWhat later culture added is a pile. Algernon Blackwood’s 1910 novella The Wendigo popularized the English spelling and a wilderness-possession plot for white readers. Marvel comics, Until Dawn, and a mass of horror films gave it a deer skull and antlers that are not standard in the older Algonquian descriptions. Margaret Atwood, Joseph Boyden, Tomson Highway, Basil Johnston, and Norval Morrisseau have used the figure in literature and painting, sometimes as a metaphor for colonial greed and residential-school trauma—Armand Ruffo’s film A Windigo Tale does this explicitly. Those uses are modern commentary. They are not a license to invent a cryptid. Tell the ice, the hunger, the isolation, and the human still inside the heart.",

    "story": "Alkarısı is the childbed demon of Turkish and wider Turkic folk belief. She is also called al, alanası, alkızı, alkarı, albası, albıs, and, for the illness she causes, albastı. The TDV İslâm Ansiklopedisi treats her as a folk being blamed for puerperal fever: a cin, peri, or devil who attacks the lohusa, the woman in the forty days after birth, and the newborn. If no one stops her, both can die. She is said to haunt stables, ruins, riverbanks, fountains, and springs, and to go after horses as well as women. The usual picture is an old, extremely ugly woman in a red shirt, long-bodied, long-fingered, with copper or horse-like teeth, tangled black hair, and—in many tellings—backward feet. Beautiful ones are also said to exist, and men who catch them may marry them.\n\nFolk belief keeps two types. The first does not kill. She rides horses at night and plaits their manes, a night-hag habit shared with much of Europe. A man who smears pitch or black gum on the horse’s back can catch her; a needle or packing-needle stuck in her body forces her into human shape, and she can be kept as a servant. Houses that have caught one become an ocak, a hearth-line; people of that line are ocaklı, and she will not come near them or their things. The second type is the killer. She goes after a woman who has not yet completed her forty days and has been left alone. She sits on the chest, tears out liver, heart, or kidney, and runs for running water. If she dips the organ in the stream, the woman cannot be saved. Signs of albasması include stretching, severe pain, seeing the room as red, fainting, raving, and foaming at the mouth. When blood appears, she has already seized the organ; the helpers must frighten her and snatch the liver back before it touches water.\n\nThe forty-day watch is the main defense. The new mother is not left alone. A lamp burns day and night. A Qur’an, a mirror, onion, garlic, and an amulet hang near her. Under the pillow go a knife, dagger, scissors, bread, a man’s jacket or vest, and a needle pinned in the cloth. A red ribbon is tied on the mother’s head and on the cradle, because she is said to hate red—or, in the older color logic, because al means red and the color both names and wards her. Iron is the older Turkic guard; the Qur’an is the Islamic one. If she has already come, a hocca or an ocaklı person recites over the patient; a gun is fired; iron tools are banged; a red or gray horse may be led into the room and made to neigh, and barley placed on the sick woman is fed to the horse. Cats and dogs were sometimes kept out of the room for fear she would wear their shape. In some Kyrgyz practice, an eagle was brought to the birth place.\n\nShe also sits on men’s chests at night, bringing nightmare and asphyxia, and she harasses girls and mares. Luminița Munteanu has argued that the Anatolian figure is a late local form of a Mesopotamian childbed demon filtered through Jewish Lilith traditions; most Turkish scholars treat her as Turkic, the dark counterpart of the protective goddess Umay. For a script, the Anatolian rules are enough: forty days, liver and water, iron and red, the ocak line.\n\nWhat later culture added is a Lilith costume and internet “Turkic mythology” pages that freeze her as a single red witch. She is not a village vampire. She is not a ghost of a woman who died in childbirth (that is a different European type). Modern medicine’s identification of albastı with puerperal infection, noted already in the 1989 encyclopedia article, explains why the figure has lost force where hospitals replaced the forty-day closed room. The folk story is the closed room, the missing liver, and the race to the creek.",
    "mustKeep": "Forty-day window, liver-into-water rule, iron and red, two types (horse-rider vs killer), ocaklı families. Do not recast her as Lilith-in-Turkey or as a childbirth ghost. Do not skip the water-race.",

    "id": "myling",
    "title": "Myling (myrding / utburd)",
    "country": "Sweden (nationwide rural legend; Norwegian utburd, Icelandic útburður, Finnish ihtiriekko/liekkiö as cousins)",

    "year": "Word attested 1647; legends of unbaptized hidden infants from early modern peasant society into the 20th c.",
    "hook": "The ghost of a murdered, unbaptized newborn that cries for a name or a grave—and may dance its mother to death or crush a stranger carrying it to the churchyard.",
    "story": "A myling is not a fairy child and not a generic ghost. In Swedish folk belief it is the revenant of a newborn killed by its mother and hidden so that an illegitimate birth would not be known. The word is from older Swedish myrða, to murder; it is documented from 1647. Dialect forms include möling and mjöling. Other archive names are utkasting, utböling, gast, and mölklack. The Norwegian cousin is utburd, the child “carried out.” Bengt af Klintberg indexes the Swedish legends in The Types of the Swedish Folk Legend; the Institute for Language and Folklore (ISOF) still treats the myling as a standard väsen of peasant society.\n\nThe social fact behind the stories is ugly and documented. From the Middle Ages into the twentieth century, an unmarried mother faced exclusion and legal punishment. Early Norse Christian law already forbids exposing infants, which means the practice was common enough to ban. The hidden body went into a bog, a dungheap, a stone cairn, a forest slope, under a floor, or in an attic. Some women tried to smuggle the bundle into a church wall or into the church itself so the child would lie in consecrated ground. When old houses and church walls are opened, such burials are still found. The child, unbaptized and unburied in holy earth, could not rest.\n\nWhat the myling does is a set of legend types, not one plot. The most common Swedish type: the hidden child makes itself known so the body will be found and the mother’s crime exposed. It cries from the hiding place. Sometimes it cries for as many years as it would have lived. Sometimes it calls, “Give me a name!” A living person can save it by answering, “You may take mine; I am called N.N.” Finding the corpse and burying it in the churchyard is the other salvation. A darker type: at the mother’s wedding, when the dance has started, a voice comes from under the floorboards—“the tub is tight, the legs are long, I want to dance once more”—and a small boy rises, seizes the bride, and dances her to death. Another Bergslagen legend: a crofter walking home from the tavern is asked by a little boy, “Grandfather, may I nurse?” He finally says the boy may nurse someone, but not him. He comes home to find his daughter dead on the bench, blood from her breasts; his permission sent the child to its mother. In some tellings the myling drinks the mother dry through the breast.\n\nA further type, better known in some overviews than in the Swedish core, has the myling leap on a night wanderer’s back and demand to be carried to the graveyard. It grows heavier as they near the gate, until the carrier sinks into the ground. If the living person cannot finish the trip, the myling kills in rage. ISOF notes that peace comes either when the child is named or when it has taken its revenge. Less often, such children call to other children from brooks and drown a playmate. A related but separate being, the nattramn, is a child killed the same way who flies at night as a raven, never lower than the height of an ox, making a sound like a dry wagon wheel.\n\nProtections are the Christian ones the stories assume: baptism, a name, consecrated burial, iron (scissors laid as a cross). The legends are not hunting manuals. They are about a child that society refused to count.\n\nWhat later culture added: Johan Egerkrans’s illustrated Nordiska väsen, video-game wraiths, and internet “top Scandinavian monsters” lists that make the myling a backpack-demon for hikers. The churchyard-burden tale is real in the wider Scandinavian set, but the Swedish archive heart is the crying from the floor, the request for a name, and the wedding dance. Do not invent a demonology or a way to “fight” it with weapons. The only folk endings are a name, a grave, or revenge on the mother.",
    "mustKeep": "Unbaptized hidden infant, name or consecrated grave as release, wedding-dance and breast-revenge types. Klintberg/ISOF are the Swedish core. Do not make a combat creature. The churchyard-burden variant is Scandinavian, not the only Swedish form.",
    "sensitivity": "These legends sit on infanticide forced by shame laws. Do not blame “evil mothers,” and do not write the dead infant as a jump-scare pet.",

    "title": "Vrykolakas (βρυκόλακας / vourkolakas)",

    "hook": "A swollen, undecayed corpse that leaves the grave, knocks once on doors, sits on sleepers, and eats flesh—especially livers—rather than drinking blood.",
    "story": "The vrykolakas is the Greek revenant, a solid dead body that has not gone the way Orthodox death is supposed to go. The word is borrowed from Slavic vǎrkolak / vukodlak, originally “werewolf,” but in Greek it names an undead corpse, not a living wolf-man. Leo Allatius, Greek librarian of the Vatican, wrote in 1645 that the vrykolakas is an evil person, often one excommunicated by a bishop; the body swells until the limbs are tight, hard, and when tapped it thrums like a drum. Later descriptions add a ruddy, gorged look. This is not a mist or a ghost. It is meat that will not rot.\n\nHow a person becomes one is a list tied to Orthodox burial. A sacrilegious life. Excommunication. Burial in unconsecrated ground. The curse of parents. Tampering with magic. Eating meat from a sheep wounded by a wolf or werewolf. Suicide and lack of baptism appear in later summaries. Henry Fanshawe Tozer, in 1869, put excommunication first and oldest. Decomposition, in this theology, is a sign that the soul has been received; an intact, drum-tight body is a public problem. During the Great Famine of 1941–42, when perhaps 300,000 Greeks starved and families had to bury outside churchyards or watch bodies dumped in mass graves, people still feared those dead would walk, and some families beheaded corpses in advance.\n\nWhat it does is not primarily drink blood. Greek accounts make it a flesh-eater with a taste for livers, closer to a ghoul than to the later literary vampire. It leaves the grave and roams. It knocks on house doors and calls the resident by name. If no one answers the first knock, it passes. If someone answers, that person dies in a few days and becomes another vrykolakas. Hence a village rule still cited: do not open at the first knock. It also sits on the chests of sleepers and crushes or suffocates them, like a mare or incubus. It can start epidemics. Left alone it grows stronger. It rests in the grave on Saturday, the only safe day to deal with it—the same Saturday rest attached to some Bulgarian vampires.\n\nDestruction is physical and, for the Church, awkward. Methods include exorcism, boiling water, oil or vinegar, impaling, beheading, cutting the body to pieces, and cremation. Burning is the surest popular method and the one priests most disliked, because a body anointed with holy oil should not be burned. Joseph Pitton de Tournefort, the French botanist, watched an exhumation on Mykonos in 1701 and published it in 1717–18: the islanders opened a suspected grave, the corpse was “slain” in front of him, and the clergy were nervous. Father François Richard had already written from Santorini in 1657. These reports reached the West a generation before the Habsburg “vampire” cases in Serbia. Álvaro García Marín has noted that for a Western European of 1730, the undead celebrity was still Greek.\n\nArchaeology matches the folklore. On Lesbos, Ottoman-period burials include an adult pinned at neck, pelvis, and feet with 20-centimeter nails, and another with bent spikes among the bones. Charles Thomas Newton, British vice-consul, wrote in the 1860s of an islet off Lesbos where Greeks still buried their vrykolakadhes. Older Greek graves at Khirokitia and Kamarina show bodies pinned with millstones or amphora sherds; those are ancient practices against the restless dead, not proof that the word vrykolakas is Neolithic.\n\nApotropaics for the newly dead include burial face-down, a wax cross and a potsherd inscribed “Jesus Christ conquers” on the corpse, coins or sickles in the grave, and grain scattered for the dead to count. Folk vrykolakas has no aristocratic manners, no invitation rule from Stoker, and no sparkling skin. It is a swollen neighbor who knocks once. Do not import Slavic blood-drinking as the main diet, and do not confuse the name’s werewolf etymology with the creature’s behavior. The wolf stayed in the word. The body that walks is a drum.",
    "mustKeep": "Drum-swollen undecayed corpse, first-knock rule, liver/flesh diet, Saturday rest, excommunication/unconsecrated burial. Tournefort 1701 is the set-piece, not a fictional hunt. Do not make a blood-drinking count. The Slavic werewolf etymology is linguistic, not behavioral.",

      "Tournefort watched a Mykonos exhumation in 1701; Allatius described the drum-body in 1645.",

    "id": "crimen-fuencarral",
    "title": "The Crime of Fuencarral Street",

    "hook": "A Madrid widow is found stabbed and set alight; her narcotized maid and the family bulldog are asleep in the next room, and Spain’s first mass-media murder trial follows.",
    "story": "In the early hours of 2 July 1888, neighbours on Madrid’s calle de Fuencarral smelled petroleum and burning flesh. Smoke was coming from the second-floor left apartment of number 109 — a door that no longer exists on today’s numbering; the building still stands at the corner with calle del Divino Pastor. Judge Felipe Peña, the porter and two guards entered. In a closed bedroom they found Luciana Borcino, widow of Vázquez Varela, on her back, rags soaked in petroleum still burning over her. In an adjoining room her maid of six days, Higinia Balaguer Ostalé, and the widow’s bad-tempered bulldog lay unconscious under a narcotic.\n\nAutopsy showed the fire was meant to hide the killing. Three stab wounds were still visible in the chest; one had pierced the heart and caused immediate death. Higinia had marks consistent with a struggle. She was arrested the same day. Luciana was a wealthy Galician known in the barrio for a harsh temper and a rapid turnover of servants. Higinia was an illiterate Aragonese who had entered the house only days earlier. The widow’s son, José Vázquez Varela — “el Pollo Varela” — had a record of theft, assaults on women, and, on one earlier occasion, stabbing his mother when she refused him money. On the night of the murder he was serving a sentence in the Cárcel Modelo for stealing a cloak from a café. That alibi, and Higinia’s short tenure in the house, pointed the first investigation at the maid as a thief who had killed to rob.\n\nHiginia did not stay silent. Over the following months she gave a succession of statements — later writers count as many as twenty — accusing, in shifting combinations, her friend Dolores Ávila (“Lola la Billetera”), Varela, and José Millán Astray, director of the Modelo and father of the later founder of the Spanish Legion. She claimed Varela left prison at night through Millán Astray’s friendship, that the two men and Lola had killed Luciana for her money, and that she had only opened the door. Jewels taken from the flat were later found at Dolores Ávila’s house. Former prime minister Nicolás Salmerón took Higinia’s defence. A group of Madrid papers joined as popular prosecutors against the “señoritos.” Madrid split into higinistas and varelistas. Benito Pérez Galdós sat through the oral trial and sent long dispatches to the Buenos Aires daily La Prensa; he interviewed Higinia more than once and, in his last chronicle, said he believed her guilty but did not believe the whole truth had come out, despite hundreds of witnesses.\n\nLate in the trial Higinia incriminated herself and Lola. On 25 May 1890 the court condemned her to death for the complex crime of robbery and homicide, sentenced Dolores Ávila as accomplice to eighteen years, and acquitted Vázquez Varela, Millán Astray and María Ávila. The government refused clemency and asked the queen regent, María Cristina, not to intervene. On Saturday 19 July 1890 Higinia was executed by garrote vil on a scaffold at the Cárcel Modelo. Contemporary reports put the crowd near twenty thousand. Press accounts of a last shout — “¡Lola, catorce mil duros!” or a close variant naming Dolores and a sum of money — were printed at the time; their exact wording and meaning were never established. Varela was later imprisoned in Ceuta after a separate killing on calle Montera. Galdós’s caution still stands: the judgment closed the case; later novels, films and café theories that restore Varela as the hidden author, or that treat Higinia’s last words as a decoded payoff, are legend contamination, not evidence.",
    "mustKeep": "Luciana Borcino found stabbed and burning at Fuencarral 109 on 2 July 1888; Higinia and the dog narcotized; Higinia’s many shifting statements; jewels at Dolores Ávila’s; death sentence and 19 July 1890 garrote; Varela and Millán Astray acquitted; Galdós’s published doubt that the whole truth emerged.",

    "id": "lead-masks-vintem",

    "hook": "Two electronics technicians are found dead on a Niterói hill in suits and homemade lead eye-masks, beside a note about capsules and a signal; no cause of death was ever proved.",
    "story": "On 17 August 1966, Manoel Pereira da Cruz, 32, and Miguel José Viana, 34, electronics technicians from Campos dos Goytacazes, left home saying they were going to buy work materials. They carried a large sum in cash — later press figures vary; a 2026 O Globo reconstruction gives about 2.3 million cruzeiros, then roughly a thousand U.S. dollars. They took a bus to Niterói, across the bay from Rio de Janeiro. Receipts and witnesses place them at the bus station, at an electronics shop, and buying waterproof coats because it was raining. At a bar they bought a bottle of mineral water. The waitress later told police that Viana seemed nervous and kept checking the time. That is the last solid sighting.\n\nOn the afternoon of 20 August a boy flying a kite on Morro do Vintém, in the Santa Rosa district of Niterói, found two bodies in difficult scrub. Police and firefighters did not reach them until the next day. The men lay side by side, partly covered by grass, in formal suits and the new raincoats. There were no signs of a fight and no obvious trauma. Beside them: an empty water bottle, a packet with two wet towels, and crude masks cut from thin lead sheet in the shape of eyeless spectacles. A notebook contained electronics part numbers — later UFO writers treated these as ciphers; contemporaneous checking found ordinary component codes — and a schedule in awkward Portuguese: “16:30 estar no local determinado. 18:30 ingerir cápsulas, após efeito proteger metais aguardar sinal mascara.” A fair translation is: 16:30 be at the agreed place; 18:30 take capsules; after the effect, protect metals, wait for the mask signal. Later retellings polish this into a tidy order to cover half the face with the lead masks. That smoother wording is paraphrase, not the notebook.\n\nThe bodies were already badly decomposed. No toxicology was done; the stated reason in later accounts is that the coroner’s office was overloaded. No capsules were found. Most of the cash was gone. At Miguel’s workshop police found lead offcuts and tools consistent with the masks, and spiritualist literature with passages marked about intense luminosity. A friend, Élcio Gomes, told police the men belonged to a circle of “scientific spiritualists” who built devices and used isolated hills, and that a garden apparatus of theirs had exploded some weeks earlier. On 14 September 1966 O Globo reported that delegate Idovan Ferreira had concluded a failed parapsychological experiment. A self-described yoga teacher later told Folha de S.Paulo that local spiritualist groups used psychedelic drugs; that is opinion, not a lab result. After about three years the file was archived without a cause of death.\n\nUFO contamination started almost immediately. Days after the discovery, Rio papers printed a resident’s claim of an orange disc over the hill on the night the men went up. There is no photograph, no second contemporaneous witness of record, and no mechanism linking a light in the sky to two dead technicians. English-language saucer magazines (Flying Saucer Review, 1967; later Jacques Vallée) folded in an earlier, thinly sourced story of another technician found dead on a different hill with a similar mask. That prior death has never been documented to the same police standard as Vintém. Brian Dunning’s 2014 review of the Portuguese and English paper trail leaves the case unsolved and treats the spiritualist-plus-capsules reading as the only account that fits the objects actually found. No living private person is named here as a killer. The documented residue is two planned arrivals, homemade eye-shields, a note about capsules and a signal, a missing toxicology, and a police file closed without a cause.",
