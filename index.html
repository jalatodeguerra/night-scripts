    "hook": "If you hear a woman sobbing by the water — ¡Ay, mis hijos! — do not go looking for her.",
    "script": "They say she was beautiful, and that was the start of the trouble. In the version told most often, a woman — sometimes called María — marries a man above her station. They have children. Then she sees him with another woman, richer, lighter, someone he can take into the world she cannot enter. Rage does the rest. She takes the children to the river and holds them under until the current keeps them. The moment they go still, she wants them back. She wades in after them. She does not come out the same.\n\nNow she walks the banks in white, hair long and black, crying for the children she cannot find. ¡Ay, mis hijos! If the cry sounds far away, she is close. If it sounds close, she is far. That is the rule in more than one country that borrowed her. Children are told: stay away from the water after dark. Night walkers are told: do not follow a weeping woman toward the river. Some say she mistakes living children for her own. Some say she only wants company in the dark. Either way, the people who go to comfort her are the ones who do not come home.",

    "hook": "On the Venezuelan plains, if a whistle sounds far away — run. That means he is already next to you.",
    "script": "Out on the llanos, they listen for a whistle that climbs the scale — do, re, mi, fa, sol, la, si — and then falls again. If it sounds close, you can breathe. He is far. If it sounds thin and distant, he is standing in the grass beside you.\n\nThey say he was a son who killed his father. In the common telling, a spoiled young man, drunk, demanded deer offal. When the hunt failed, he murdered his father, cut out the entrails, and had his mother cook them. When she understood what was in the pot, the grandfather took over the punishment: the boy was whipped until his back opened, chili or liquor was rubbed into the wounds, a sack of the father’s bones was hung on him, and dogs were set on him. The curse was that he would walk forever.\n\nNow he is impossibly tall — some say three meters, some six — a thin shape in a wide hat, sack over one shoulder. He hunts drunks and womanizers. He sits outside a house and counts bones. If the people inside do not hear the counting, there will be a wake by morning. Dogs, a whip, and chili are said to drive him off. Nothing else is reliable.",
    "mustKeep": "Inverse-distance whistle. Origin is parricide + grandfather’s curse (a second variant has the son kill the father after the father abuses the son’s wife — do not merge them). Sack of bones. Prey: drunkards, womanizers. Shared Venezuela/Colombia llanero culture, not “all of South America.”",

    "script": "Japan, 1979. Children stop walking home alone. Parents form patrols. The rumor is a tall woman in a surgical mask, sometimes a red coat, carrying scissors or a knife. She steps out of the dark and asks if she is pretty.\n\nSay no, and she kills you. Say yes, and she pulls the mask down. The mouth is cut from ear to ear. Then she asks again: Even like this? Say no, and the scissors come out. Say yes, and she gives you a smile to match hers.\n\nKids invented exits the way kids do. Call her “average.” Throw bekko-ame hard candy so she stoops to pick it up. Shout “pomade” three times. Say you are late, and in some tellings she bows and lets you pass. None of this was in a holy book. It spread through juku cram schools, then local papers — Gifu Nichi Nichi Shimbun, 26 January 1979 — then national weeklies, then television. By August the summer holiday broke the gossip chain. The woman in the mask did not clock out. She just waited for the next generation to walk home after dark.",

    "script": "In Malay folklore she is the rage that follows a death in childbirth. By day she may hide in a banana tree. By night she walks as a beautiful woman in white, hair down her back. You smell frangipani first. Then you smell a corpse.\n\nShe announces herself with an infant’s cry or a woman’s laugh. Same trick as other night-walkers in this part of the world: if the sound is faint, she is near; if it is loud, she is far. Dogs howl when she is in the district and whine when she is at the fence. She finds men by the scent of laundry left out overnight. Her nails open them. She is said to take the organs, and to hunt pregnant women and infants.\n\nThere is a way, the stories say, to pin her: a nail driven into the nape of the neck (or, in some Indonesian tellings, the crown of the head). She becomes a quiet, beautiful wife — until someone pulls the nail. In 1771, the first sultan of the city that took her name is said to have fired cannons into the jungle until the spirits fled, then built a mosque and a palace on the cleared ground. The city kept the name anyway.",
    "mustKeep": "Modern form is a woman who died pregnant or in childbirth. Skeat (1900) distinguished langsuir (woman dead in childbirth) from pontianak (stillborn child); later tellings fused them — say this on camera. Inverse-volume cry; plumeria then decay; banana trees; nail in the nape. City of Pontianak, Indonesia, named for her; founding legend 1771.",
    "sensitivity": "Childbirth death. Do not sexualize her. Living belief, not a costume.",
    "sources": [

    ]

    "id": "tokoloshe",
    "title": "Tokoloshe / Tikoloshe / uThikoloshe",

    "hook": "In parts of South Africa, people still put bricks under the bed legs. They are not decorating.",
    "script": "They describe him as small — knee-high, hip-high — hairy, baboon-faced, a man who is not a man. Older stories put him in rivers and reeds: a water sprite, mischievous, dangerous, able to vanish if he drinks water or swallows a stone. Later and parallel stories say a witch or a vengeful neighbor can send one. Then he is not a river thing. He is a weapon.\n\nHe comes at night, into the house, to the people sleeping on the floor. Illness. Terror. Sometimes death. The household answer that outsiders always quote is simple: raise the bed. Bricks under each leg. Sleep above his reach. Sangomas and certain pastors are asked to drive him out when bricks are not enough.\n\nMissionaries wrote the name down in the 1830s because everyone already knew it. The Dictionary of South African English still treats it as living vocabulary. City papers still run the word in headlines. You do not have to believe in him to understand the rule the story teaches: something low and unseen moves through the dark of the house, and the people who sleep on the ground are the ones it finds first.",
    "mustKeep": "Nguni water-spirit and/or witch-sent familiar — do not collapse into one origin. Short, hairy, can turn invisible. Protection: elevate the bed. Documented in English by 1833. The “carbon monoxide in rondavels” explanation is modern speculation, not the folk story.",
    "sensitivity": "Current belief. Do not call it “ignorant.” Do not lean into older sexualized tellings. Avoid mocking sangomas.",
    "sources": [
      "https://dsae.co.za/entry/tokoloshe/e07240",
      "https://doi.org/10.1086/317407"
    ]

    "hook": "In communist Poland, the car you were not supposed to get into was not a van. It was a black Volga with white curtains.",
    "script": "A GAZ Volga — the Soviet executive sedan, black as a government car — slides down a Polish street after dark. White wheel rims. White curtains in the windows. Sometimes no plates. Sometimes the number is 666. Children were told: that car takes people.\n\nWho drives it depends on the year you heard the story. Secret police. Organ thieves. Satanists. The Devil, who rolls down the window and asks the time. If you answer, you die on the spot, or you die at that same hour tomorrow. The counter-charm, in the devil version, is to say, “It is God’s time.” Then the car is gone.\n\nThe Volga was real. Party men rode in them. So did the kind of officials you did not question. A 1965 Warsaw kidnapping that actually used a black Volga gave the rumor a news hook. The rest grew the way bloc rumors grew: blood sold to rich foreigners, kidneys taken for Soviet clinics. Years later the car changes — BMW, Mercedes — but the empty back seat and the white curtains stay.",
    "mustKeep": "Black GAZ-21 or GAZ-24; white curtains / white rims. Poland is the best-documented core. Motives shift with politics. Do not use the antisemitic 1968 variant as content. Devil-asks-the-time version: answer “God’s time.”",
    "sensitivity": "Child-abduction panic. Skip blood-libel and racist driver variants entirely.",

      "Jan Harold Brunvand, Encyclopedia of Urban Legends"
    ]

    "id": "spring-heeled-jack",
    "title": "Spring-heeled Jack",
    "country": "England",
    "kind": "urban-legend",
    "kindLabel": "Urban legend",
    "duration": "70–80 sec",

    "hook": "Victorian London had a devil who knocked on your door, vomited blue fire, and jumped a nine-foot wall laughing.",
    "script": "January 1838. The Lord Mayor of London reads a letter from Peckham: someone in a devil’s costume is terrifying servant girls for a wager. The papers pick it up. The name is already in the street: Spring-heeled Jack.\n\nOn 19 February, Jane Alsop answers her father’s door in Old Ford. A man claims to be police. He says they have caught Spring-heeled Jack in the lane. She brings a candle. He throws off his cloak. Eyes like red balls of fire. A helmet. Tight white oilskin. He spits blue-white flame and tears her gown with metal claws. Her sister pulls her inside. He is gone.\n\nNine days later, Lucy Scales walks Green Dragon Alley in Limehouse. A cloaked figure waits in the angle of the passage and puts blue flame in her face. She drops, in fits for hours. He does not even touch her. He walks away.\n\nThe police never take him. Penny dreadfuls do. For the rest of the century he leaps mail coaches, slaps sentries at Aldershot, and, they said, laughs from rooftops. The last famous claim is Liverpool, 1904. What remains, if you strip the later novels, is this: a fire-breathing gentleman-devil who used the police’s own voice to get a girl to open the door.",
    "mustKeep": "Best-documented attacks: Jane Alsop (19 Feb 1838) and Lucy Scales (28 Feb 1838). Traits: cloak, helmet, oilskin, metal claws, blue flame, red eyes, huge leaps. Lord Mayor Sir John Cowan publicized the panic on 9 Jan 1838. Identity unknown; Marquess of Waterford is a period rumor, not a conviction. Do not treat 20th-c. UFO Jack as the 1838 legend.",
    "sensitivity": "Core cases are assaults on teenage girls. Tell as historical panic, not titillation.",
    "sources": [
      "https://www.history.co.uk/articles/the-mystery-of-spring-heeled-jack",
      "Mike Dash, “Spring-heeled Jack,” Fortean Studies vol. 3 (1996)"
    ]
  },
  {
    "id": "manananggal",
    "title": "Aswang — tell the Manananggal",
    "country": "Philippines (Visayas especially)",
    "kind": "folklore",
    "kindLabel": "Folklore",
    "duration": "70–85 sec",
    "year": "",
    "hook": "In the Visayas they will tell you: if you hear tik-tik on the roof over a pregnant woman, do not look up. Look at the floor. That is where the other half of her is.",
    "script": "Aswang is not one monster. Filipino folklorist Maximo Ramos sorted the word into five: vampire, viscera-sucker, weredog, witch, ghoul. The image that travels is the viscera-sucker — Tagalog manananggal, “the one who separates.”\n\nBy day she is a woman in the village. By night she splits at the waist. The upper body grows wings. The hips and legs stay behind, hidden, because if you salt them or turn them over she cannot return. The flying half goes to the house of a pregnant woman, or a sick one, and puts down a tongue like a thread. Through the thatch, through the bamboo floor, into the body. What she wants is the liver, the unborn child, the phlegm of the dying.\n\nSpanish priest Tomas Ortiz wrote a version of this in 1731: the creature on a neighboring roof, tongue like a thread, drawing out the child. Plasencia, in 1589, already listed flying flesh-eaters among the Visayans and called the aswang the spirit people feared most. Garlic, salt, ash, a stingray tail, light and noise at a wake — the counter-charms are a whole household science. The horror is not a stranger in the forest. It is the neighbor who goes home before dark.",
    "mustKeep": "Aswang is an umbrella word — pick manananggal and say you are picking. Self-segmentation at the waist; thread-like tongue. Documented 16th c. Capiz association is popular, not exclusive. Do not retell CIA “Huk aswang” psy-ops as folklore.",
    "sensitivity": "Still a living accusation. Do not point at a real town as “monster country.”",
    "sources": [
      "https://www.jstor.org/stable/1499218 (Ramos, 1969)",
      "Plasencia, Customs of the Tagalogs (1589)"
    ]
  },
  {
    "id": "banshee",
    "title": "Banshee (bean sí / bean sídhe)",
    "country": "Ireland",
    "kind": "folklore",
    "kindLabel": "Folklore",
    "duration": "55–65 sec",
    "year": "",
    "hook": "In Ireland the most frightening sound is not a scream that hunts you. It is a scream that already knows your family’s name.",
    "script": "She is not a murderer. That is the first thing the old families will tell you. The banshee is a woman of the sídhe — the fairy mounds that break the Irish fields. At night she keens. The sound is the sound professional mourners used to make over a corpse, except there is no corpse yet.\n\nYou hear her at the old house, even if the dying person is in another country. Sometimes she is a washerwoman at a ford. Sometimes a tall thin woman in white or grey, combing her hair on a riverbank. Sometimes an old hag. The cry belongs to certain Gaelic names — Ó and Mac, the families that were here before the Normans — though later tellings let anyone hear her. Once the household admits the cry, death is coming. You cannot bargain it off.\n\nThe National Folklore Collection is full of schoolchildren’s copies of this: she follows the O’s and the Macs; she is heard the night before; you do not want to see her. She is grief arriving one night early, and she already knows the way to your door.",
    "mustKeep": "Death omen, not attacker. Irish bean sí = woman of the fairy mound. Traditionally attached to old Gaelic families (Ó / Mac). Appearance varies. Do not import Scottish bean-nighe details as Irish banshee canon.",
    "sensitivity": "Keening is a real mourning practice. Not a “Celtic demon.”",
    "sources": [
      "https://www.britannica.com/topic/banshee",
      "https://www.duchas.ie/en/cbes/5177618/5173617/5198606",
      "Patricia Lysaght, The Banshee (1986)"
    ]
  },

    "hook": "Lock the bathroom door. Kill the lights. Say her name into the mirror. The only argument is how many times.",
    "script": "Every American school building has the same bad room: no windows, a row of sinks, a mirror that does not owe you anything. The game is simple. Lights off. Face the glass. Say Bloody Mary. Three times. Thirteen. Forty-seven. Some kids say “I believe in Mary Worth.” Some prick a finger first.\n\nIf you did it right, a woman is in the mirror. A witch. A girl with a cut forehead. A mother holding a dead baby. She scratches the glass, or your face, or she just looks at you until you break and hit the lights.\n\nNobody can agree who she was. Queen Mary I of England is a popular guess and a weak one — folklorists mostly reject it. A witch. A murdered girl. The name slides: Mary Worth, Mary Whales, Mary Jane. Alan Dundes read the whole rite as puberty fear: blood, a bathroom, a girl’s face arriving in the glass. You do not need his theory to feel the trap. You said the name. You are the one who asked her to come through.",
    "mustKeep": "The story is the ritual, not a single biography. Names and counts vary. Scholars do not treat Queen Mary I as the source. Do not invent a “true crime Mary.”",
    "sensitivity": "Children’s dare. Do not instruct kids to lock themselves in dark rooms.",
    "sources": [
      "Alan Dundes, Bloody Mary in the Mirror (2002)",

      "https://www.ebsco.com/research-starters/sports-and-leisure/bloody-mary-folklore"
    ]
  },

    "id": "greenbrier-ghost",
    "title": "The Greenbrier Ghost",
    "country": "United States — Greenbrier County, West Virginia",
    "kind": "true-crime",
    "kindLabel": "True crime",
    "duration": "70–80 sec",
    "year": "1897",
    "hook": "A mother told a West Virginia court her dead daughter had named the killer. The autopsy, not the ghost story, is what the doctors actually wrote down.",
    "script": "TRUE CRIME. Greenbrier County, West Virginia, 1897. Elva Zona Heaster Shue had been married only a short time when she was found dead at home on 23 January. A local doctor first treated it as a natural death.\n\nHer mother, Mary Jane Heaster, went to prosecuting attorney John A. Preston and demanded another look. On 22 February the body was exhumed. Three physicians — Drs. Knapp, Rupert, and Houston McClung — found the neck broken and the windpipe crushed. The Greenbrier Independent reported it that week. Edward Stribbling “Trout” Shue, a blacksmith, was jailed and indicted for murder.\n\nAt trial in Lewisburg that June, the State used the autopsy and Shue’s conduct around the body. The defense, hoping to make Mary Jane look unstable, asked her about visions. She testified — the Independent printed the questions — that her daughter had come to her four times while she was awake and said her neck had been “squeezed off at the first joint.” The prosecution had not opened with a ghost. The defense put that story on the record.\n\nIn early July 1897 the jury returned first-degree murder after one hour and ten minutes and recommended life in prison. Shue went to the penitentiary at Moundsville and died there on 13 March 1900. What the court had was a broken neck, a mother who would not stop, and a husband who stayed in town because he thought circumstantial evidence could not convict him.",
    "mustKeep": "Victim Elva Zona Heaster Shue, died 23 Jan 1897. Autopsy 22 Feb: broken neck, crushed windpipe. Defendant Edward Stribbling “Trout” Shue. First-degree murder, life sentence (Greenbrier Independent, 8 July 1897; jury out 1 hour 10 minutes). Died 13 Mar 1900 at Moundsville — about three years later, not “eight.” The ghost story entered on defense cross-examination, not as prosecution evidence.",
    "sensitivity": "Do not say: “Only case in which a ghost convicted a murderer” (tourism copy). Do not invent the “no meat for supper” fight as proven motive.",
    "sources": [
      "https://wvdn.com/14205/",
      "https://wvencyclopedia.org/entries/2107"
    ]
  },
  {
    "id": "phantom-of-heilbronn",
    "title": "The Phantom of Heilbronn",
    "country": "Germany",
    "kind": "true-crime",

    "duration": "65–75 sec",
    "year": "1993–2009",
    "hook": "Police spent sixteen years hunting Europe’s most dangerous woman. Her DNA was at forty crime scenes. Then they found her on a cotton swab that had never left the factory.",
    "script": "TRUE CRIME. For sixteen years, German police thought they were hunting a woman who did not exist.\n\nFrom 1993 into 2009, the same female DNA profile turned up at about forty crime scenes — burglaries, thefts, and six killings, including the 25 April 2007 shooting of police officer Michèle Kiesewetter in Heilbronn. Investigators called the unknown woman the Phantom of Heilbronn, or the Woman Without a Face. By January 2009 the reward was 300,000 euros. They released a photofit. It showed a man.\n\nThen the profile appeared where it could not: on papers tied to a dead man. A second test did not find it. In late March 2009, prosecutor Volker Link said the puzzle was solved. The cotton swabs used to lift evidence were sterile — they killed germs — but they were not certified free of human DNA. An unnamed woman who worked at a swab factory in Bavaria had left her own genetic material on unused sticks. Police had been typing the equipment.\n\nThere was no female serial killer linking those forty scenes. Kiesewetter’s murder, and other real crimes in the pile, had to be pulled back out and investigated as themselves. The “phantom” was a factory trace on a Q-tip. The woman whose DNA started the hunt had committed no crime.",
    "mustKeep": "Same female DNA at ~40 scenes, 1993–2009. Linked in the file to six murders, including Michèle Kiesewetter, 25 Apr 2007. Reward €300,000 (Jan 2009). March 2009: prosecutor Volker Link — contamination; no phantom offender. Swabs sterile but not DNA-free. Do not name the factory worker. Do not say she “sneezed on the swabs.”",
    "sensitivity": "Do not say: One woman committed all forty crimes. Do not collapse Kiesewetter’s real murder into a ghost story.",
    "sources": [

    "duration": "70–80 sec",

    "script": "TRUE CRIME. England, the 1910s. Three women died in rented bathtubs. Three different inquests called it an accident.\n\nIn July 1912, Beatrice “Bessie” Mundy was found drowned at 80 High Street, Herne Bay. Her husband, using the name Henry Williams, had taken her to a doctor for supposed fits. She had made a will in his favor days before. The inquest said misadventure.\n\nIn December 1913, Alice Burnham died in a bath at 16 Regent Road, Blackpool, after marrying a man who used the name George Smith. Another accidental drowning.\n\nOn 18 December 1914, Margaret Elizabeth Lofty — married the day before under the name John Lloyd — was found dead in a bath at 14 Bismarck Road, Highgate. Another inquest: accident.\n\nAlice’s father, Charles Burnham, saw a newspaper account of the Highgate death and recognized the pattern. Police found one man under the three husbands: George Joseph Smith, a bigamist. He was tried at the Old Bailey from 22 June 1915 for Mundy’s murder. The judge allowed the other two deaths as evidence of a “system.” Pathologist Bernard Spilsbury told the court those tubs were a poor fit for an ordinary epileptic drowning. The jury was out about twenty minutes. Guilty, 1 July 1915. Smith was hanged at Maidstone Prison on 13 August 1915.\n\nHe did not need a new method. He needed three towns, three names, and three inquests that never compared notes.",

    "script": "TRUE CRIME. In 1910 the Atlantic was supposed to be large enough to vanish into. It was not.\n\nCora Crippen, who performed as Belle Elmore, was last seen after a gathering at 39 Hilldrop Crescent, London, on 31 January 1910. Her husband, Hawley Harvey Crippen, an American homeopath, told friends she had gone to America, then that she had died there. His typist, Ethel Le Neve, moved into the house. Friends went to Scotland Yard. Inspector Walter Dew interviewed Crippen. Crippen and Le Neve fled.\n\nPolice searched again. In mid-July they found human remains under the cellar floor. Warrants went out. The pair had already boarded the Canadian Pacific liner SS Montrose at Antwerp, Le Neve dressed as a boy.\n\nCaptain Henry Kendall recognized them and, before the ship steamed out of wireless range, had a Marconi operator telegraph London. Dew crossed on a faster ship, the Laurentic, and was waiting in the St. Lawrence. He arrested them on 31 July 1910 as the Montrose approached Quebec — the first time wireless telegraphy was used to catch a fleeing suspect.\n\nCrippen was tried at the Old Bailey in October, convicted of Cora’s murder after twenty-seven minutes, and hanged at Pentonville on 23 November 1910. Le Neve was acquitted. Later DNA claims about the remains have been disputed; the 1910 verdict was never overturned. The ocean had a telegraph now.",
